<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公会竞标赛助手 2.0.2</title>
<style>
:root{
  --bg:#fff9f7;--paper:#fffefd;--paper-2:#fffafc;--ink:#3f3547;--muted:#817686;
  --line:#eadfea;--line-strong:#dfcfe4;
  --pink:#e88db8;--pink-deep:#c96198;--pink-soft:#fff0f7;
  --lav:#9f82d7;--lav-deep:#6f54aa;--lav-soft:#f3effd;
  --violet:#7654c7;--violet-soft:#eee9ff;
  --mint:#75a98a;--mint-soft:#edf8f1;
  --amber:#c99542;--amber-soft:#fff7df;
  --danger:#c95f72;--danger-soft:#fff0f3;
  --blue:#648da9;--blue-soft:#eef6fb;
  --shadow:0 18px 46px rgba(86,62,94,.08);
  --shadow-sm:0 8px 24px rgba(86,62,94,.07);
  --radius:24px;--radius-sm:16px;
  --safe-bottom:env(safe-area-inset-bottom,0px);--app-vh:100dvh;
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;font-size:16px;line-height:1.5;background:
  radial-gradient(circle at 8% 2%,rgba(232,141,184,.13),transparent 24%),
  radial-gradient(circle at 96% 7%,rgba(159,130,215,.14),transparent 25%),
  linear-gradient(180deg,#fff9f7 0%,#fffdfb 52%,#fff8fb 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;background-image:
  radial-gradient(circle at 20% 18%,rgba(159,130,215,.28) 0 1px,transparent 1.5px),
  radial-gradient(circle at 81% 32%,rgba(232,141,184,.28) 0 1px,transparent 1.5px),
  radial-gradient(circle at 36% 76%,rgba(159,130,215,.20) 0 1px,transparent 1.5px);background-size:180px 180px,220px 220px,260px 260px}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.grow{flex:1}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.icon{width:20px;height:20px;display:inline-block;vertical-align:middle}.icon svg{width:100%;height:100%;display:block}
.card{background:rgba(255,254,253,.96);border:1px solid rgba(234,223,234,.95);border-radius:var(--radius);box-shadow:var(--shadow)}
.paper{position:relative;overflow:hidden}.paper:after{content:"✦";position:absolute;right:20px;top:13px;color:rgba(159,130,215,.18);font-size:23px;pointer-events:none}
.soft-panel{padding:21px;background:linear-gradient(145deg,rgba(255,253,252,.97),rgba(249,244,255,.94))}
.btn{border:0;border-radius:15px;padding:10px 16px;font-weight:760;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.16s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.52;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--pink),#aa84e2);color:#fff;box-shadow:0 10px 24px rgba(198,94,152,.2)}
.btn-primary:hover{filter:saturate(1.05)}.btn-soft{background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft));color:var(--lav-deep)}
.btn-ghost{background:rgba(255,255,255,.76);color:var(--ink);border:1px solid var(--line)}.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-success{background:var(--mint-soft);color:#4e7d5c}.btn-butter{background:var(--amber-soft);color:#8c651f}.btn-sm{padding:7px 11px;border-radius:12px;font-size:13px;min-height:34px}
.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:15px;background:#fffdfd;color:var(--ink);padding:12px 14px;outline:none;transition:.16s}
.input:focus,.select:focus,.textarea:focus{border-color:#d99ac4;box-shadow:0 0 0 4px rgba(232,141,184,.12)}.textarea{min-height:112px;resize:vertical}
.label{display:block;font-size:13px;font-weight:760;margin-bottom:7px;color:#5a4e60}.helper{font-size:12px;color:var(--muted);line-height:1.58}
.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.section-title{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:0 0 16px}.section-title h2,.section-title h3{margin:0}.section-title p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.58}
.divider{height:1px;background:var(--line);margin:18px 0}.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed #dbcfe1;border-radius:18px;background:#fffbfd;line-height:1.8}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:760;background:#f5eff4;color:#6e626f;vertical-align:middle}
.pill.high{background:var(--amber-soft);color:#8c641c}.pill.good{background:var(--mint-soft);color:#4e7b59}.pill.bad{background:var(--danger-soft);color:var(--danger)}.pill.blue{background:var(--blue-soft);color:#527b96}.pill.lav{background:var(--lav-soft);color:var(--lav-deep)}
.kpi{padding:18px;position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;width:82px;height:82px;border-radius:50%;right:-30px;bottom:-35px;background:linear-gradient(135deg,rgba(232,141,184,.12),rgba(159,130,215,.14))}.kpi b{display:block;font-size:27px;margin-top:8px}.kpi span{font-size:13px;color:var(--muted)}
.callout{padding:14px 16px;border-radius:16px;background:var(--amber-soft);color:#77571e;line-height:1.7;border:1px solid #efdfb5}
.advice{padding:15px 16px;border-radius:17px;background:var(--blue-soft);color:#466f88;line-height:1.7;margin:14px 0;border:1px solid rgba(100,141,169,.16)}
.advice.warn{background:var(--amber-soft);color:#7e5e1f;border-color:#efdeaa}.advice.bad{background:var(--danger-soft);color:#9d4455;border-color:#f1ccd5}.advice.good{background:var(--mint-soft);color:#477451;border-color:#cfe7d5}.advice.lav{background:var(--lav-soft);color:#685591;border-color:#ded3f3}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-bottom));z-index:9999;transform:translate(-50%,20px);opacity:0;background:#443948;color:#fff;padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-mask{position:fixed;inset:0;background:rgba(54,44,58,.36);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;backdrop-filter:blur(5px)}
.modal{width:min(720px,100%);max-height:90dvh;overflow:auto;background:#fffdfd;border-radius:25px;padding:24px;box-shadow:0 28px 90px rgba(50,38,58,.25);border:1px solid rgba(255,255,255,.82)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.modal-head h2,.modal-head h3{margin:0}.modal-close{width:38px;height:38px;border:0;border-radius:50%;background:#f6eff5;color:#6f626f;font-size:20px;flex:0 0 auto}
.footer-note{max-width:1180px;margin:30px auto 0;padding:24px 18px 30px;text-align:center;color:#91858f;font-size:12px;line-height:1.86;border-top:1px dashed #ded1dc}.footer-note button{border:0;background:transparent;color:#7358a8;padding:0;text-decoration:underline;text-underline-offset:3px}

/* 登录页 */
.landing{min-height:100vh;padding:28px 20px;display:flex;flex-direction:column;justify-content:center}.landing-wrap{width:min(1040px,100%);margin:auto}.landing-box{display:grid;grid-template-columns:1.08fr .92fr;overflow:hidden}
.landing-brand{padding:48px;background:
  radial-gradient(circle at 78% 18%,rgba(255,255,255,.33),transparent 24%),
  linear-gradient(145deg,#ec9bbf 0%,#b192e1 62%,#9074d2 100%);color:#fff;position:relative;overflow:hidden}
.landing-brand:before{content:"✦   ·   ✧";position:absolute;right:26px;top:20px;letter-spacing:6px;opacity:.42}.landing-brand:after{content:"";position:absolute;width:300px;height:300px;border:1px solid rgba(255,255,255,.18);border-radius:48% 52% 58% 42%;right:-130px;bottom:-150px;transform:rotate(18deg)}
.brand-mark{width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:29px;font-weight:850;margin-bottom:25px;border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.landing-brand h1{font-size:35px;line-height:1.25;margin:0 0 17px}.landing-brand p{line-height:1.82;opacity:.96;margin:0 0 13px}.feature-list{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px;margin-top:25px}.feature-list div{display:flex;gap:9px;align-items:center;font-size:13px}.feature-dot{width:23px;height:23px;border-radius:9px;background:rgba(255,255,255,.19);display:grid;place-items:center;flex:0 0 auto}.landing-game-note{margin-top:22px;padding:14px 15px;border-radius:16px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);font-size:13px;line-height:1.7}
.landing-form{padding:43px;background:#fffdfc}.landing-form h2{margin:0 0 7px}.tabs{display:flex;background:#f7f0f5;border-radius:15px;padding:4px;margin:22px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:12px;color:var(--muted);font-weight:760}.tabs button.active{background:#fff;color:var(--pink-deep);box-shadow:var(--shadow-sm)}
.login-mini-footer{margin-top:22px;padding-top:17px;border-top:1px dashed var(--line);text-align:center;font-size:11px;color:#968a93;line-height:1.75}.login-mini-footer button{border:0;background:none;color:#7358a8;text-decoration:underline;padding:0}

/* 小妙管理 */
.admin-shell{max-width:1160px;margin:0 auto;padding:30px 22px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.admin-head h1{margin:0}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.admin-tabs button.active{background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft));color:var(--lav-deep);border-color:#ddcce9}
.guild-admin-item{padding:18px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-bottom:12px}.guild-admin-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.danger-menu{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.admin-guild-tools{padding:16px;margin-bottom:16px}.admin-guild-filter-grid{display:grid;grid-template-columns:minmax(240px,1.4fr) minmax(150px,.65fr) minmax(150px,.65fr) auto;gap:10px;align-items:end}.admin-guild-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 2px 14px}.channel-pill{background:linear-gradient(135deg,#fff2f8,#f0ebff);color:#745a9a;border:1px solid #e6d7ef}.channel-pill.empty{background:#f7f2f5;color:#887c87;border-color:#eadfe6}.guild-card-title{font-size:16px;overflow-wrap:anywhere}.guild-card-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}.guild-admin-note{margin-top:8px;overflow-wrap:anywhere}

/* 主应用 */
.app-shell{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh}.sidebar{padding:18px 14px;border-right:1px solid var(--line);background:rgba(255,253,251,.88);backdrop-filter:blur(15px);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:30}
.app-brand{padding:8px 10px 20px;display:flex;gap:11px;align-items:center}.app-brand-logo{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;display:grid;place-items:center;font-weight:850;box-shadow:var(--shadow-sm)}.app-brand strong{display:block}.app-brand small{color:var(--muted)}
.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:14px;color:#695f6e;font-weight:720;display:flex;align-items:center;gap:10px}.nav button.active{background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft));color:#76536d}.nav button:hover{background:#fbf4f8}.nav-icon{width:26px;height:26px;border-radius:10px;background:rgba(159,130,215,.08);display:grid;place-items:center;color:var(--lav-deep)}
.side-bottom{margin-top:auto}.guild-mini{padding:13px;background:linear-gradient(135deg,#fff5f8,#f5f0fd);border-radius:15px;margin-bottom:9px}.guild-mini strong,.guild-mini small{display:block}.guild-mini small{margin-top:4px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}.topbar{min-height:74px;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);background:rgba(255,249,247,.88);backdrop-filter:blur(15px);position:sticky;top:0;z-index:25}.topbar h1{font-size:20px;margin:0}.top-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.content{padding:24px 28px 40px;max-width:1320px;width:100%;margin:0 auto;flex:1}
.preview-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 15px;border-radius:16px;background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft));border:1px solid #e4d5ed;margin-bottom:16px}.preview-banner b{color:var(--lav-deep)}
.mobile-nav{display:none}.mobile-more-btn{display:none}

/* 首页 */
.home-hero{padding:0;overflow:hidden;margin-bottom:18px;background:linear-gradient(145deg,#fff8fc 0%,#f6f0ff 100%)}
.home-hero-inner{display:grid;grid-template-columns:1.2fr .8fr;min-height:230px}.home-main{padding:25px}.home-side{padding:22px;border-left:1px solid rgba(221,207,229,.72);background:rgba(255,255,255,.48)}
.round-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.rank-line{display:flex;align-items:flex-end;gap:12px;margin:20px 0 12px}.rank-number{font-size:66px;font-weight:850;line-height:.9;background:linear-gradient(135deg,var(--lav-deep),var(--pink-deep));-webkit-background-clip:text;color:transparent}.rank-label{padding-bottom:7px;color:var(--muted)}
.battle-gap{font-size:14px;color:var(--muted)}.battle-gap b{display:block;margin-top:6px;font-size:28px;color:var(--pink-deep)}
.progress-ribbon{height:12px;border-radius:999px;background:#efe7f0;overflow:hidden;margin-top:15px}.progress-ribbon i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pink),var(--lav))}
.home-search{padding:19px;margin-bottom:18px;background:rgba(255,254,253,.95)}.home-search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.home-search .input{padding:15px 16px;font-size:16px}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick-action{border:1px solid var(--line);background:#fffdfd;border-radius:18px;padding:17px;text-align:left;display:flex;align-items:center;gap:12px;color:var(--ink)}.quick-action:hover{border-color:#ddc7e1;box-shadow:var(--shadow-sm)}.quick-icon{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft));color:var(--lav-deep);font-size:20px}.quick-action b,.quick-action small{display:block}.quick-action small{margin-top:4px;color:var(--muted)}
.mode-mini{display:grid;gap:9px}.mode-mini button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px;text-align:left;color:var(--ink)}.mode-mini button.active{border-color:#d4b6e1;background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft))}.mode-mini b,.mode-mini small{display:block}.mode-mini small{margin-top:4px;color:var(--muted);line-height:1.45}

/* 查询 */
.search-hero{padding:23px;background:linear-gradient(135deg,#fffdfd,#fff3f8 55%,#f3effd);margin-bottom:18px}.search-box{position:relative}.search-box input{padding:16px 18px 16px 48px;font-size:16px}.search-icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--pink-deep);font-size:20px}
.result-group{margin:19px 0}.result-list{display:grid;gap:10px}.result-item{padding:14px 15px;border:1px solid var(--line);border-radius:17px;background:#fffefd;display:flex;justify-content:space-between;gap:12px;align-items:center;transition:.16s}.result-item:hover{border-color:#dfc5dc;box-shadow:var(--shadow-sm);transform:translateY(-1px)}.result-main{min-width:0}.result-main strong{display:block}.result-main small{display:block;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-side{display:flex;gap:7px;align-items:center;flex-shrink:0}
.task-detail{padding:21px;margin-top:18px}.task-title-row{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.task-title-row h2{margin:0 0 9px}.strategy-row,.filter-row{display:flex;gap:8px;flex-wrap:wrap}.strategy-btn,.filter-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;color:var(--muted);font-weight:720}.strategy-btn.active,.filter-btn.active{background:var(--pink-soft);border-color:#e2b8d0;color:var(--pink-deep)}
.candidate-list{display:grid;gap:10px}.candidate{padding:14px;border:1px solid var(--line);border-radius:17px;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:#fffefd}.candidate.primary{border-color:#e1b9d5;background:linear-gradient(135deg,#fff5fa,#f5f0ff)}.candidate-rank{width:36px;height:36px;border-radius:13px;background:var(--lav-soft);color:var(--lav-deep);display:grid;place-items:center;font-weight:850}.candidate strong{display:block}.candidate small,.candidate-reason{color:var(--muted);display:block;margin-top:4px;line-height:1.55;font-size:12px}.candidate-actions{text-align:right}

/* 成员 */
.member-layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px}.member-list{padding:14px;max-height:calc(100vh - 146px);overflow:auto;position:sticky;top:90px}.member-list button{width:100%;border:0;background:transparent;padding:12px;border-radius:14px;text-align:left;color:var(--ink);margin-bottom:4px}.member-list button:hover,.member-list button.active{background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft))}.member-list button small{display:block;margin-top:4px;color:var(--muted)}
.member-editor{min-width:0}.member-profile{padding:21px;margin-bottom:16px}.member-editing-label{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--lav-soft);color:var(--lav-deep);font-size:12px;font-weight:760}
.member-ability-section{padding:21px}.task-toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto auto auto;gap:9px;align-items:center}.batch-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 14px}.task-groups{display:grid;gap:15px;margin-top:15px}.task-group h4{margin:0 0 9px;font-size:14px;color:#685d6c}.task-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.task-check{border:1px solid var(--line);border-radius:15px;background:#fffdfd;padding:12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:.15s}.task-check:hover{border-color:#dfc6dc;transform:translateY(-1px)}.task-check.checked{background:linear-gradient(135deg,var(--pink-soft),var(--lav-soft));border-color:#d9bddf}.task-check input{margin-top:3px;accent-color:var(--pink-deep);width:18px;height:18px}.task-check strong{font-size:13px;display:block;line-height:1.45}.task-check small{color:var(--muted);display:block;margin-top:4px}
.task-save-bar{position:sticky;bottom:10px;z-index:12;margin-top:16px;padding:13px 15px;background:rgba(255,253,253,.96);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:12px;backdrop-filter:blur(12px)}
.ability-mobile-trigger{display:none}.ability-sheet{display:none}

/* 登记：单次 / 批量 */
.record-mode-tabs{display:flex;gap:7px;padding:5px;background:#f7f0f5;border-radius:16px;margin:14px 0 18px;max-width:360px}
.record-mode-tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 14px;color:var(--muted);font-weight:760}
.record-mode-tabs button.active{background:#fff;color:var(--pink-deep);box-shadow:var(--shadow-sm)}
.batch-record-list{display:grid;gap:12px;margin-top:14px}
.batch-record-card{padding:15px;border:1px solid var(--line);border-radius:18px;background:#fffdfd;transition:.16s}
.batch-record-card.error{border-color:#e8aebb;background:var(--danger-soft)}
.batch-record-card.success{border-color:#badcc3;background:var(--mint-soft)}
.batch-record-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.batch-record-head b{display:flex;align-items:center;gap:8px}
.batch-record-grid{display:grid;grid-template-columns:minmax(150px,.85fr) minmax(135px,.65fr) minmax(160px,.8fr) minmax(240px,1.5fr);gap:10px;align-items:end}
.batch-task-field{display:grid;grid-template-columns:minmax(120px,.7fr) minmax(180px,1.3fr);gap:8px}
.batch-record-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;margin-top:11px}
.batch-summary{padding:13px 15px;border-radius:16px;margin:12px 0;border:1px solid var(--line);line-height:1.65}
.batch-summary.good{background:var(--mint-soft);color:#477451;border-color:#cfe7d5}
.batch-summary.warn{background:var(--amber-soft);color:#7e5e1f;border-color:#efdeaa}

async function loadTaskLibrary(includeInactive=false){
  let taskRows=null,taskError=null;
  const v3=await db.rpc('get_accessible_tasks_v3',{p_include_inactive:!!includeInactive});
  if(!v3.error){
    taskRows=v3.data;
    app.taskWorkflowReady=true;
  }else{
    const fallback=await db.rpc('get_active_tasks_v2',{p_include_inactive:!!includeInactive});
    taskRows=fallback.data;
    taskError=fallback.error;
    app.taskWorkflowReady=false;
  }
  const {data:setting,error:e2}=await db.from('app_settings').select('*').eq('key','task_library').maybeSingle();
  if(taskError)throw taskError;
  if(e2)throw e2;
  if(!Array.isArray(taskRows)||taskRows.length===0)throw new Error('TASK_LIBRARY_EMPTY');
  app.tasks=taskRows;
  const v=setting?.value||{};
  app.taskLibrary={version:v.version||'2026.06',updatedAt:v.updated_at||setting?.updated_at||null};
}

function csvCell(v){const s=String(v??'');return/[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
function downloadCsv(filename,headers,rows){
  const body=[headers, ...rows].map(row=>row.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF'+body],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function taskSimilarityList(name,excludeId=null){
  const key=norm(name);if(!key)return[];
  return tasks(true).filter(t=>t.id!==Number(excludeId)).map(t=>{
    const tk=norm(t.name);let score=0;
    if(tk===key)score=100;
    else if(tk.includes(key)||key.includes(tk))score=80;
    else{
      const chars=[...new Set(key)],same=chars.filter(c=>tk.includes(c)).length;
      score=chars.length?Math.round(60*same/chars.length):0;
    }
    return{task:t,score};
  }).filter(x=>x.score>=45).sort((a,b)=>b.score-a.score||a.task.name.localeCompare(b.task.name,'zh-CN')).slice(0,6);
}

function snapshotTrend(){
  const snaps=[...app.snapshots].sort((a,b)=>new Date(a.captured_at)-new Date(b.captured_at));
  const endAt=currentGuild()?.competition?.scheduledEndAt;
  const hoursLeft=endAt?Math.max(0,(new Date(endAt)-Date.now())/3600000):null;
  if(snaps.length<2)return{available:false,hours:0,hoursLeft,changes:[],lastAt:snaps.at(-1)?.captured_at||null};
  const currentA=snaps.at(-2),currentB=snaps.at(-1);
  const currentHours=Math.max(.05,(new Date(currentB.captured_at)-new Date(currentA.captured_at))/3600000);
  const previousA=snaps.length>=3?snaps.at(-3):null,previousB=snaps.length>=3?snaps.at(-2):null;
  const previousHours=previousA?Math.max(.05,(new Date(previousB.captured_at)-new Date(previousA.captured_at))/3600000):null;
  const findOld=(rows,row)=>rows.find(x=>x.id&&row.id&&x.id===row.id)||rows.find(x=>x.is_self===row.is_self&&x.is_self)||rows.find(x=>x.name===row.name);
  const changes=(currentB.competitors||[]).map(row=>{
    const old=findOld(currentA.competitors||[],row);
    const add=Math.max(0,Number(row.score||0)-Number(old?.score||0));
    const perHour=add/currentHours;
    let previousPerHour=null,accelerationLabel='数据不足';
    if(previousA){
      const prevEnd=findOld(previousB.competitors||[],row),prevStart=findOld(previousA.competitors||[],row);
      const prevAdd=Math.max(0,Number(prevEnd?.score||0)-Number(prevStart?.score||0));
      previousPerHour=prevAdd/previousHours;
      if(previousPerHour<1&&perHour<1)accelerationLabel='基本稳定';
      else if(perHour>=previousPerHour*1.5&&perHour-previousPerHour>=50)accelerationLabel='明显加速';
      else if(perHour>previousPerHour*1.12)accelerationLabel='开始加速';
      else if(perHour<=previousPerHour*.55&&previousPerHour-perHour>=50)accelerationLabel='明显放缓';
      else if(perHour<previousPerHour*.88)accelerationLabel='有所放缓';
      else accelerationLabel='基本稳定';
    }
    const projectedScore=hoursLeft===null?null:Math.round(Number(row.score||0)+perHour*hoursLeft);
    return{...row,add,perHour,previousPerHour,accelerationLabel,projectedScore};
  });
  return{available:true,hours:currentHours,hoursLeft,changes,lastAt:currentB.captured_at,snapshotCount:snaps.length};
}
function competitionCalc(){
  const g=currentGuild(),c=g.competition;
  const rows=[...c.competitors].sort((a,b)=>b.score-a.score||a.arrival-b.arrival);
  const self=c.competitors.find(x=>x.isSelf);
  if(!self)return{rows,rank:0,targetGap:0,totalRem:0,capRem:0,effectiveRem:0,scenarios:[],risk:'未知',freePotential:0,paidNeeded:0,plans:[]};

  const rank=rows.findIndex(x=>x.id===self.id)+1;
  const first=rows[0],second=rows[1],fourth=rows[3],fifth=rows[4],next=rows[rank]||null;
  const tiePoint=opponent=>opponent&&opponent.arrival<self.arrival?1:0;
  let opponent=null,targetLabel='',targetScore=Number(self.score),buffer=Number(c.safetyMargin||0);
  if(c.goalMode==='promote'){
    opponent=rank===1?second:first;
    targetScore=opponent?Number(opponent.score)+buffer+tiePoint(opponent):Number(self.score);
    targetLabel=rank===1?'第一名参考领先线还差':'冲第一参考目标还差';
  }else if(c.goalMode==='avoid'){
    opponent=rank===5?fourth:fifth;
    targetScore=opponent?Number(opponent.score)+buffer+tiePoint(opponent):Number(self.score);
    targetLabel=rank===5?'脱离第五参考线还差':'避免第五参考线还差';
  }else if(c.goalMode==='steady'||c.goalMode==='save'){
    opponent=next;
    targetScore=opponent?Number(opponent.score)+buffer+tiePoint(opponent):Number(self.score);
    targetLabel=c.goalMode==='save'?'免费守位参考线还差':'稳住当前名次还差';
  }else{
    targetScore=Math.max(0,Number(c.customGoalScore||0)+buffer);
    targetLabel='自定义参考目标还差';
  }
  const targetGap=Math.max(0,targetScore-Number(self.score));

  const liveLogs=g.logs.filter(l=>!l.reversedAt);
  const sampleCount=liveLogs.length;
  const avgBase=sampleCount?liveLogs.reduce((n,l)=>n+Number(l.basePoints||0),0)/sampleCount:Number(c.avgBase||24);
  const doubledCount=liveLogs.filter(l=>l.doubled).length;
  const doubleRate=sampleCount?doubledCount/sampleCount:Number(c.doubleRate||0)/100;
  const avgAward=sampleCount?liveLogs.reduce((n,l)=>n+Number(l.points||0),0)/sampleCount:avgBase*(1+doubleRate);
  const averageSource=sampleCount===0?'手动估值':sampleCount<10?'本轮真实记录 · 样本较少':'本轮真实记录';

  const active=g.members.filter(m=>m.active&&m.targetMode!=='inactive');
  const freeRem=active.reduce((n,m)=>n+Math.max(0,c.freeLimit-m.freeUsed),0);
  const paidRem=active.reduce((n,m)=>n+Math.max(0,c.paidLimit-m.paidUsed),0);
  const totalRem=freeRem+paidRem;
  const capRem=Math.max(0,c.taskCap-c.guildTasksCompleted);

  const freeCount=Math.min(freeRem,capRem);
  const freeAdd=Math.floor(freeCount*avgAward);
  const freePlan={key:'free',label:'只用剩余免费次数',count:freeCount,freeCount,paidCount:0,add:freeAdd,final:Number(self.score)+freeAdd};

  let personalFree=0,personalPaid=0;
  for(const m of active){
    const mf=Math.max(0,c.freeLimit-m.freeUsed),mp=Math.max(0,c.paidLimit-m.paidUsed);
    if(m.targetMode==='free_only'||m.targetMode==='normal'){
      personalFree+=mf;
      continue;
    }
    const target=m.targetMode==='custom'?Number(m.goal||0):Number(c.personalTarget||1400);
    const need=Math.max(0,target-Number(m.currentPoints||0));
    let attempts=need>0?Math.ceil(need/Math.max(1,avgAward)):0;
    const useFree=Math.min(mf,attempts);attempts-=useFree;
    const usePaid=Math.min(mp,attempts);
    personalFree+=useFree;personalPaid+=usePaid;
  }
  let personalCount=Math.min(capRem,personalFree+personalPaid);
  const personalFreeCount=Math.min(personalFree,personalCount);
  const personalPaidCount=Math.min(personalPaid,Math.max(0,personalCount-personalFreeCount));
  const personalAdd=Math.floor(personalCount*avgAward);
  const personalPlan={key:'personal',label:'按成员个人目标执行',count:personalCount,freeCount:personalFreeCount,paidCount:personalPaidCount,add:personalAdd,final:Number(self.score)+personalAdd};

  const allCount=Math.min(capRem,totalRem);
  const allFreeCount=Math.min(freeRem,allCount);
  const allPaidCount=Math.min(paidRem,Math.max(0,allCount-allFreeCount));
  const allAdd=Math.floor(allCount*avgAward);
  const allPlan={key:'all',label:'全部剩余次数估算',count:allCount,freeCount:allFreeCount,paidCount:allPaidCount,add:allAdd,final:Number(self.score)+allAdd};

  const paidNeeded=Math.max(0,Math.ceil(Math.max(0,targetScore-freePlan.final)/Math.max(1,avgAward)));
  const paidAvailable=Math.min(paidRem,Math.max(0,capRem-freeCount));
  let conclusion='free',actionTitle='先清剩余免费次数，暂不购买';
  let actionText=`剩余免费资源预计可以推进到 ${fmt(freePlan.final)} 分。`;
  if(targetGap===0){
    conclusion='hold';actionTitle='当前已经达到参考目标，先观察对手';
    actionText='无需为了“刚好领先”立即继续投入，可先保存快照并按观察时间复查。';
  }else if(freePlan.final>=targetScore){
    conclusion='free';actionTitle='先清剩余免费次数，暂不购买';
    actionText=`免费资源预计覆盖参考目标，并保留约 ${fmt(freePlan.final-targetScore)} 分缓冲。`;
  }else if(allPlan.final>=targetScore){
    conclusion='paid';actionTitle=`免费次数不足，先分批使用约${paidNeeded}次购买任务`;
    actionText=`完成免费次数后仍缺 ${fmt(targetScore-freePlan.final)} 分。按当前平均每次 ${fmt(avgAward)} 分估算。`;
  }else{
    conclusion='insufficient';actionTitle='全部剩余次数预计仍不足';
    actionText=`即使使用全部剩余次数，仍预计缺少 ${fmt(targetScore-allPlan.final)} 分。需要调整目标、提高平均分或增加参与成员。`;
  }

  const freeBuffer=Math.max(0,Math.floor(freePlan.final-targetScore));
  const personalBuffer=Math.max(freeBuffer,Math.floor(personalPlan.final-targetScore));
  const trend=snapshotTrend();
  const opponentTrend=opponent?trend.changes?.find(x=>x.id===opponent.id||x.name===opponent.name):null;
  const recommendedObserve=trend.hoursLeft!==null?(trend.hoursLeft<=4?1:trend.hoursLeft<=14?2:4):battleObserveHours;
  const observeHours=[1,2,4].includes(Number(battleObserveHours))?Number(battleObserveHours):recommendedObserve;

  const coverage=new Map();
  for(const m of active)for(const id of m.abilities)coverage.set(id,(coverage.get(id)||0)+1);
  const memberRecommendations=active.map(m=>{
    const p=memberProgress(m),mf=Math.max(0,c.freeLimit-m.freeUsed),mp=Math.max(0,c.paidLimit-m.paidUsed);
    const rare=m.abilities.map(taskById).filter(Boolean).filter(t=>(coverage.get(t.id)||0)<=2);
    const highRare=rare.filter(t=>t.points>=28);
    let score=0;const reasons=[];
    if((p.mode==='sprint_1400'||p.mode==='custom')&&p.need>0&&p.need<=memberNearThreshold&&mf>0){score+=80;reasons.push(`距目标还差${fmt(p.need)}分`)}
    if(highRare.length){score+=55;reasons.push(`可做${highRare.length}项高分稀缺任务`)}
    else if(rare.length){score+=30;reasons.push(`可做${rare.length}项稀缺任务`)}
    if(mf>0){score+=Math.min(35,mf*4);reasons.push(`免费剩余${mf}次`)}
    if(p.need>memberNearThreshold&&p.mode!=='normal'&&p.mode!=='free_only'){score+=12;reasons.push('个人目标尚未完成')}
    if(p.need<=0&&(p.mode==='sprint_1400'||p.mode==='custom')){score-=15;reasons.push('个人目标已完成')}
    if(m.status==='暂时不在线')score-=25;
    if(m.status==='任务进行中')score-=8;
    if(!reasons.length)reasons.push('按剩余免费次数正常安排');
    return{member:m,score,reasons,freeRem:mf,paidRem:mp,need:p.need,rare,highRare};
  }).sort((a,b)=>b.score-a.score||b.freeRem-a.freeRem).slice(0,8);

  const goalConfigured=active.filter(m=>m.targetMode&&m.targetMode!=='normal').length;
  const abilityConfigured=active.filter(m=>m.abilities.length>0).length;
  const risk=conclusion==='insufficient'?'高':conclusion==='paid'?'中':'低';
  const chances=5-c.round,maxStage=Math.min(8,c.currentStage+chances),needPromotions=Math.max(0,c.targetStage-c.currentStage);

  return{
    rows,self,rank,first,second,fourth,fifth,next,opponent,targetScore,targetGap,targetLabel,buffer,
    totalRem,freeRem,paidRem,capRem,effectiveRem:allCount,freeEffective:freeCount,
    freePotential:freeAdd,paidNeeded,paidAvailable,plans:[freePlan,personalPlan,allPlan],
    freePlan,personalPlan,allPlan,avgBase,avgAward,doubleRate,sampleCount,averageSource,
    conclusion,actionTitle,actionText,freeBuffer,personalBuffer,trend,opponentTrend,
    observeHours,recommendedObserve,risk,memberRecommendations,goalConfigured,abilityConfigured,
    activeCount:active.length,chances,maxStage,needPromotions,
    scenarios:[freePlan,personalPlan,allPlan]
  };
}
function goalModeLabel(v){return({promote:'冲第一升段',avoid:'避免第五降段',steady:'稳住当前名次',save:'节省钻石',custom:'自定义目标'})[v]||v}

async function addCustomTask(){

function loadBulkTaskFile(input){
  const file=input.files?.[0];if(!file)return;
  if(file.size>2*1024*1024){input.value='';return toast('文件过大，请控制在2MB以内')}
  const reader=new FileReader();
  reader.onload=()=>{document.getElementById('bulkTaskText').value=String(reader.result||'').replace(/^\uFEFF/,'');toast(`已载入 ${file.name}，请先预览`)};
  reader.onerror=()=>toast('文件读取失败');reader.readAsText(file,'utf-8');
}

function parseBulkTaskRows(raw){const rows=[],errors=[];raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach((line,i)=>{let name='',points='';const tab=line.match(/^(.*?)[\t,，]+\s*(\d+)\s*$/);const space=line.match(/^(.*?)\s+(\d+)\s*$/);const m=tab||space;if(m){name=m[1].trim();points=Number(m[2])}if(!name||!Number.isFinite(points)||points<1||points>99)errors.push({line:i+1,text:line});else rows.push({name,base_points:points})});return{rows,errors}}
function previewBulkTasks(){
  const parsed=parseBulkTaskRows(document.getElementById('bulkTaskText').value);if(!parsed.rows.length)return toast('没有识别到可导入的任务');

}

async function saveTaskEdit(id,forcedName=null,forcedPoints=null){

function renderMergeTaskOptions(sourceId){
  const select=document.getElementById('mergeTargetTask');if(!select)return;

  const source=taskById(sourceId);
  const list=tasks(true).filter(x=>x.id!==sourceId&&x.visibility==='public'&&x.reviewStatus==='approved'&&(!q||norm(x.name).includes(q))).sort((a,b)=>{
    const as=source?taskSimilarityList(source.name,sourceId).find(s=>s.task.id===a.id)?.score||0:0;

    return bs-as||a.name.localeCompare(b.name,'zh-CN');
  }).slice(0,150);

function openRejectTaskModal(id){
  const t=taskById(id);if(!t)return;
  openModal(`<div class="modal-head"><div><h3>驳回补充任务</h3><p class="muted">该任务将不再出现在提交公会的可选任务中。已经产生的历史记录不会删除。</p></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="advice bad"><b>${esc(t.name)}</b><br>请填写简短原因，便于后续核对。</div><textarea id="rejectTaskNote" class="textarea" style="min-height:82px" placeholder="例如：与已有任务重复、积分填写错误"></textarea><button class="btn btn-danger" style="width:100%;margin-top:14px" onclick="reviewGuildTask(${id},'reject')">确认驳回</button>`);
}
async function reviewGuildTask(id,action){
  if(!app.taskWorkflowReady)return toast('请先完成Supabase任务补充功能升级');
  const params={p_task_id:id,p_action:action,p_operator_name:operatorName(),p_target_task_id:null,p_name:null,p_base_points:null,p_review_note:null};
  if(action==='approve_edit'){
    params.p_name=document.getElementById('reviewTaskName')?.value.trim();
    params.p_base_points=Number(document.getElementById('reviewTaskPoints')?.value);
  }
  if(action==='merge')params.p_target_task_id=Number(document.getElementById('mergeTargetTask')?.value)||null;
  if(action==='reject')params.p_review_note=document.getElementById('rejectTaskNote')?.value.trim()||'未填写原因';
  if(action==='approve'&&!confirm('确认通过并同步给全部公会吗？'))return;
  await withBusy(async()=>{
    try{
      const {error}=await db.rpc('admin_review_guild_task_v3',params);
      if(error)throw error;
      closeModal();
      await reloadAdminTasksKeepState(action==='merge'?'任务已合并':action==='reject'?'任务已驳回':'任务已通过并同步');
    }catch(e){showError(e,'审核失败')}
  });
}

function exportAdminTasks(mode='all'){
  let list=tasks(true);
  if(mode==='active')list=list.filter(t=>!t.disabled);
  if(mode==='inactive')list=list.filter(t=>t.disabled);
  downloadCsv(`竞标赛任务库_${mode}_${new Date().toISOString().slice(0,10)}.csv`,['任务ID','任务名称','基础分','翻倍分','状态','来源','审核状态','所属公会','创建时间','修改时间'],list.map(t=>[t.id,t.name,t.points,t.points*2,t.disabled?'停用':'启用',t.visibility==='guild'?'公会补充':'公共任务',t.reviewStatus,t.ownerGuildId?guildNameById(t.ownerGuildId):'',fmtTime(t.createdAt),fmtTime(t.updatedAt)]));

function applyReadOnlyMode(){
  const page=document.getElementById('page');if(!page)return;
  page.querySelectorAll('input,select,textarea').forEach(el=>{
    const ph=(el.getAttribute('placeholder')||'');
    const searchable=/搜索|关键词|筛选/.test(ph)||['globalSearch','abilitySearch','abilitySearchMobile','homeSearch'].includes(el.id);
    if(!searchable){el.disabled=true;el.title='查看模式不可修改数据'}
  });
  page.querySelectorAll('button').forEach(btn=>{
    const t=(btn.textContent||'').trim();
    if(/保存|删除|导入|登记|撤销|开始新一轮|确认|切换|清空|全选|取消当前/.test(t)){btn.disabled=true;btn.title='查看模式不可修改数据'}
  });
}

function openGuildTaskSubmissionModal(prefill=''){
  if(!app.taskWorkflowReady)return openModal(`<div class="modal-head"><div><h3>暂时无法新增</h3><p class="muted">当前页面尚未完成任务补充数据库升级。</p></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="advice warn">请由小妙先运行2.0.2补丁附带的Supabase升级SQL，再上传新版 index.html。</div>`);
  openModal(`<div class="modal-head"><div><span class="pill lav">本公会补充任务</span><h3 style="margin-top:9px">新增缺失任务</h3><p class="muted">提交后本公会立即可以查询、登记能力和完成任务；小妙审核通过后才会同步给其他公会。</p></div><button class="modal-close" onclick="closeModal()">×</button></div><label class="label">任务名称</label><input id="guildTaskName" class="input" value="${esc(prefill)}" maxlength="120" placeholder="请填写游戏内完整任务名称" oninput="renderGuildTaskHints()"><div id="guildTaskHints"></div><div style="height:11px"></div><label class="label">基础积分</label><input id="guildTaskPoints" class="input" type="number" min="1" max="99" placeholder="不翻倍时的积分"><div style="height:11px"></div><label class="label">备注（可选）</label><textarea id="guildTaskNote" class="textarea" style="min-height:76px" maxlength="300" placeholder="例如：任务来自哪位人才、名称容易混淆的地方"></textarea><div class="advice warn"><b>请核对基础分</b><br>翻倍分由系统自动按基础分×2计算。公会不能删除或修改公共任务，只能补充自己缺少的任务。</div><button class="btn btn-primary" style="width:100%" onclick="submitGuildTask()">确认新增并立即使用</button>`);
  renderGuildTaskHints();
}
function renderGuildTaskHints(){
  const box=document.getElementById('guildTaskHints');if(!box)return;
  const name=document.getElementById('guildTaskName')?.value||'';
  const similar=taskSimilarityList(name);
  box.innerHTML=similar.length?`<div class="duplicate-hints">${similar.map(x=>`<button class="duplicate-hint" style="width:100%;text-align:left" onclick="closeModal();selectExistingTaskAfterDuplicate(${x.task.id})"><b>${x.score===100?'任务库中已有':'可能相似'}：${esc(x.task.name)}</b><div class="tiny muted">基础${x.task.points}分 · 点击直接使用已有任务</div></button>`).join('')}</div>`:'';
}
function selectExistingTaskAfterDuplicate(id){
  if(activeTab==='record'){
    if(recordMode==='single'){recordTaskId=Number(id);recordSearchQuery='';renderSingleRecordPanel()}
    else toast('请在批量登记的任务下拉框中选择该任务');
  }else{
    selectedTaskId=Number(id);renderTaskDecision();document.getElementById('taskDecision')?.scrollIntoView({behavior:'smooth'});
  }
}
async function submitGuildTask(){
  if(!ensureMaintain())return;
  const name=document.getElementById('guildTaskName')?.value.trim(),points=Number(document.getElementById('guildTaskPoints')?.value),note=document.getElementById('guildTaskNote')?.value.trim()||'';
  if(!name)return toast('请填写任务名称');
  if(!Number.isFinite(points)||points<1||points>99)return toast('基础积分必须在1至99之间');
  const exact=taskSimilarityList(name).find(x=>x.score===100);
  if(exact&&!confirm(`任务库中已经有“${exact.task.name}”。确定仍要提交新任务吗？`))return;
  await withBusy(async()=>{
    try{
      const {data,error}=await db.rpc('submit_guild_task_v3',{p_name:name,p_base_points:points,p_note:note,p_operator_name:operatorName(),p_guild_id:app.role==='admin'?app.guild.id:null});
      if(error)throw error;
      closeModal();
      await refreshTaskDataOnly(app.role==='admin');
      const row=data?.task||data;
      const taskId=Number(row?.id||data?.task_id||0);
      if(data?.duplicate){
        toast('已找到同名任务，直接使用现有任务');
      }else{
        toast('任务已加入本公会，并提交给小妙审核');
      }
      if(activeTab==='search'){renderSearchPage();searchQuery=name;renderSearchResults()}
      if(activeTab==='record'){
        if(recordMode==='single'&&taskId){recordOnlyAbilities=false;recordTaskId=taskId;recordSearchQuery='';renderSingleRecordPanel()}
        else renderBatchRecordPanel();
      }
      if(activeTab==='members')renderMembersPage();
    }catch(e){showError(e,'新增任务失败')}
  });
}

function candidateInfo(task,m){
  const p=memberProgress(m),c=currentGuild().competition;
  const highCount=m.abilities.filter(id=>(taskById(id)?.points||0)>=28).length;
  const capableCount=currentGuild().members.filter(x=>x.active&&x.targetMode!=='inactive'&&x.abilities.includes(task.id)).length;
  const award=task.points*2;
  const remainingFree=Math.max(0,c.freeLimit-m.freeUsed);
  const remainingAll=Math.max(0,c.freeLimit+c.paidLimit-m.freeUsed-m.paidUsed);
  let score=0;const reasons=[];let blocked=false;
  if(!m.active||p.mode==='inactive'){blocked=true;reasons.push('本轮不参与')}
  if(m.status==='次数已用完'||remainingAll<=0){blocked=true;reasons.push('次数已用完')}
  if(blocked)return{m,p,score:-9999,reasons:reasons.join('；'),label:'暂不推荐'};
  if(m.status==='可接任务'){score+=55;reasons.push('当前可接')}
  else if(m.status==='任务进行中'){score+=8;reasons.push('正在做其他任务')}
  else if(m.status==='暂时不在线'){score-=22;reasons.push('暂时不在线')}
  if(p.mode==='sprint_1400'||p.mode==='custom'){
    if(p.need<=0){score-=4;reasons.push('个人目标已完成')}
    else{
      const fit=isFinite(p.requiredAvg)?award-p.requiredAvg:0;
      if(fit>=0){score+=Math.min(42,18+fit/2);reasons.push(`翻倍${award}分可满足后续平均要求`)}
      else{score-=Math.min(35,Math.abs(fit)/2);reasons.push(`低于后续所需平均${fmt(p.requiredAvg)}分`)}
      if(p.rem<=5){score+=12;reasons.push(`只剩${p.rem}次`) }
    }
  }else if(p.mode==='free_only'){
    if(remainingFree>0){score+=18;reasons.push(`免费次数还剩${remainingFree}次`)}
    else{score-=60;reasons.push('免费次数已用完')}
  }else{score+=8;reasons.push('正常参与')}
  if(task.points<=24&&highCount>=5){score-=Math.min(22,highCount*2);reasons.push('高分能力较多，低分任务可考虑留给他人')}
  if(task.points>=28&&capableCount<=3){score+=10;reasons.push(`仅${capableCount}人能做`) }
  if(['promote','avoid'].includes(c.goalMode)){score+=Math.round(task.points*0.9);reasons.push('当前公会模式偏向即时得分')}
  if(c.goalMode==='steady'){score+=8;reasons.push('兼顾当前名次与资源')}
  if(c.goalMode==='save'){
    if(remainingFree>0){score+=16;reasons.push('可使用免费次数')}
    else{score-=35;reasons.push('需要动用购买次数')}
  }
  if(c.goalMode==='custom')score+=10;
  if(deadlineHours<=1&&m.status==='可接任务'){score+=24;reasons.push('任务临近截止')}
  return{m,p,score,reasons:reasons.join('；'),label:score>=70?'首选':score>=25?'备选':'暂不推荐'};
}
function renderTaskDecision(){
  const box=document.getElementById('taskDecision');if(!box)return;if(!selectedTaskId){box.innerHTML='';return}
  const task=taskById(selectedTaskId);if(!task){box.innerHTML='';return}
  const all=currentGuild().members.filter(m=>m.active&&m.abilities.includes(task.id)),ranked=all.map(m=>candidateInfo(task,m)).sort((a,b)=>b.score-a.score),available=ranked.filter(x=>x.score>-999);
  let advice='';
  if(!all.length)advice=`<div class="advice bad"><b>当前能力库中无人可完成</b><br>先核对成员能力是否登记完整，再决定是否删除游戏内任务。</div>`;

  box.innerHTML=`<section class="card task-detail"><div class="task-title-row"><div><span class="pill ${task.points>=29?'high':'blue'}">基础${task.points} · 翻倍${task.points*2}</span><h2 style="margin-top:9px">${esc(task.name)}</h2><p class="muted">共${all.length}名成员登记为可完成。</p></div><button class="btn btn-ghost" onclick="selectedTaskId=null;renderTaskDecision()">关闭</button></div><div class="grid grid-2" style="margin-top:14px"><div><label class="label">距离任务截止约几小时</label><input class="input" type="number" min="0" value="${deadlineHours}" onchange="deadlineHours=Number(this.value);renderTaskDecision()"></div><div><label class="label">当前公会模式</label><div class="input" style="background:#fbf5fb">${esc(goalModeLabel(currentGuild().competition.goalMode))}</div></div></div>${advice}<div class="candidate-list">${ranked.length?ranked.map((x,i)=>`<div class="candidate ${i===0&&x.score>-999?'primary':''}"><div class="candidate-rank">${i+1}</div><div><strong>${esc(x.m.name)} <span class="pill ${x.label==='首选'?'high':x.label==='备选'?'lav':'bad'}">${x.label}</span></strong><div class="candidate-reason">${esc(x.reasons)}；当前${fmt(x.p.current)}分，剩余${x.p.rem}次</div></div><div><span class="pill ${x.m.status==='可接任务'?'good':'blue'}">${esc(x.m.status)}</span></div></div>`).join(''):`<div class="empty">无人具备该任务条件。</div>`}</div></section>`;
}

function renderAbilityList(memberId,mobile=false){
  const box=document.getElementById(mobile?'abilityListMobile':'abilityList');if(!box)return;
  if(abilityDraftMemberId!==memberId){box.innerHTML='<div class="empty">成员已切换，请重新打开能力清单。</div>';return}
  const list=filteredAbilityTasks();const groups=new Map();
  for(const t of list.sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name,'zh-CN'))){if(!groups.has(t.points))groups.set(t.points,[]);groups.get(t.points).push(t)}
  box.innerHTML=list.length?`<div class="task-groups">${[...groups.entries()].map(([pts,arr])=>`<div class="task-group"><h4>${pts}分任务 · 翻倍${pts*2}分</h4><div class="task-card-grid">${arr.map(t=>`<label class="task-check ${abilityDraft.has(t.id)?'checked':''}"><input type="checkbox" ${abilityDraft.has(t.id)?'checked':''} onchange="toggleAbility(${t.id},this.checked,'${memberId}')"><span><strong>${esc(t.name)}</strong><small>基础${t.points} · 翻倍${t.points*2}</small></span></label>`).join('')}</div></div>`).join('')}</div>`:`<div class="empty" style="margin-top:14px">没有匹配任务。清空关键词或切换“全部”后可查看完整任务库。</div>`;
}
function filteredAbilityTasks(){
  let list=tasks().filter(t=>!abilityQuery||norm(t.name).includes(norm(abilityQuery)));
  if(abilityFilter==='selected')list=list.filter(t=>abilityDraft&&abilityDraft.has(t.id));
  if(abilityFilter==='high')list=list.filter(t=>t.points>=28);
  return list;
}
function toggleAbility(id,checked,memberId){
  if(abilityDraftMemberId!==memberId)return toast('成员已切换，请重新打开能力清单');
  checked?abilityDraft.add(Number(id)):abilityDraft.delete(Number(id));abilityDirty=true;
  renderAbilityViews(memberId);
}
function selectCurrentAbilityResults(memberId){filteredAbilityTasks().forEach(t=>abilityDraft.add(t.id));abilityDirty=true;renderAbilityViews(memberId)}
function deselectCurrentAbilityResults(memberId){filteredAbilityTasks().forEach(t=>abilityDraft.delete(t.id));abilityDirty=true;renderAbilityViews(memberId)}
function clearAllAbilities(memberId){if(!confirm('确定清空该成员已选择的全部任务吗？'))return;abilityDraft.clear();abilityDirty=true;renderAbilityViews(memberId)}
function toggleCustomTarget(){const mode=document.getElementById('memberTargetMode')?.value;const box=document.getElementById('customTargetWrap');if(box)box.style.display=mode==='custom'?'block':'none'}
function openDeleteMemberModal(id){const m=memberById(id);if(!m)return;openModal(`<div class="modal-head"><div><h3>永久删除误加成员</h3><p class="muted">只有没有任务历史、没有积分和次数记录的成员才能删除。其他成员请使用“停用”。</p></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="advice bad">请输入成员名字 <b>${esc(m.name)}</b> 确认。</div><input id="confirmMemberName" class="input" placeholder="请输入完整成员名字"><button class="btn btn-danger" style="width:100%;margin-top:14px" onclick="deleteMemberSafely('${m.id}')">确认永久删除</button>`)}
async function deleteMemberSafely(id){if(!ensureMaintain())return;await withBusy(async()=>{try{const {error}=await db.rpc('delete_guild_member_safely',{p_member_id:id,p_confirm_name:document.getElementById('confirmMemberName').value,p_operator_name:operatorName()});if(error)throw error;closeModal();await loadGuildData(app.guild.id);selectedMemberId=currentGuild().members.find(x=>x.active)?.id||null;abilityDraft=null;abilityDraftMemberId=null;abilityDirty=false;toast('误加成员已删除');renderApp(app.role==='admin')}catch(e){showError(e,'删除失败')}})}
function openImportMembersModal(){openModal(`<div class="modal-head"><div><h3>批量导入成员</h3><p class="muted">一行一个名字，也支持逗号分隔。已存在的同名有效成员会自动跳过。</p></div><button class="modal-close" onclick="closeModal()">×</button></div><textarea id="importNames" class="textarea" placeholder="王晓明&#10;小紫&#10;小林"></textarea><button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="importMembers()">开始导入</button>`)}
async function importMembers(){if(!ensureMaintain())return;await withBusy(async()=>{const raw=document.getElementById('importNames').value,names=raw.split(/[\n,，]/).map(x=>x.trim()).filter(Boolean);if(!names.length)return toast('请先填写成员名字');try{const {data,error}=await db.rpc('add_guild_members_v2',{p_names:names,p_operator_name:operatorName(),p_guild_id:app.role==='admin'?app.guild.id:null});if(error)throw error;closeModal();await loadGuildData(app.guild.id);selectedMemberId=data.inserted?.[0]?.id||selectedMemberId;toast(`新增${data.inserted_count}人，跳过${data.skipped_count}人`);renderApp(app.role==='admin')}catch(e){showError(e,'导入失败')}})}
async function saveMemberProfile(id){
  if(!ensureMaintain())return;
  await withBusy(async()=>{
    const m=memberById(id);if(!m)return;
    try{
      const mode=document.getElementById('memberTargetMode').value;
      const {error}=await db.rpc('save_member_full_profile_v2',{
        p_member_id:id,
        p_name:document.getElementById('memberName').value.trim(),
        p_note:document.getElementById('memberNote').value,
        p_active:document.getElementById('memberActive').value==='true',
        p_target_mode:mode,
        p_target_points:Number(document.getElementById('memberGoal')?.value)||0,
        p_current_points:Number(document.getElementById('memberPoints').value)||0,
        p_free_used:Number(document.getElementById('memberFree').value)||0,
        p_paid_used:Number(document.getElementById('memberPaid').value)||0,
        p_status:document.getElementById('memberStatus').value,
        p_expected_member_version:m.rowVersion,
        p_expected_stat_version:m.statVersion,
        p_operator_name:operatorName()
      });
      if(error)throw error;
      await loadGuildData(app.guild.id);toast('成员资料已保存');renderApp(app.role==='admin');
    }catch(e){showError(e,'保存失败');await loadGuildData(app.guild.id);renderApp(app.role==='admin')}
  });
}
async function saveAbilities(id){
  if(!ensureMaintain())return;
  if(abilityDraftMemberId!==id)return toast('成员已切换，请重新打开能力清单');
  const m=memberById(id);
  if(!m||!abilityDraft)return toast('能力清单尚未准备好，请重新打开该成员');
  if(tasks().length===0)return toast('任务库尚未加载，已阻止保存，请刷新后重试');
  const ids=[...abilityDraft].map(Number).filter(taskId=>!!taskById(taskId));
  if(ids.length!==abilityDraft.size)return toast('能力清单包含失效任务，已阻止保存，请刷新后重试');
  if(ids.length===0&&m.abilities.length>0&&!confirm(`即将把“${m.name}”原有的 ${m.abilities.length} 项能力全部清空。

只有在你确实要清空时才点“确定”。`))return;
  const saveButtons=[...document.querySelectorAll('button')].filter(btn=>(btn.textContent||'').includes('保存能力清单'));
  saveButtons.forEach(btn=>{btn.disabled=true;btn.dataset.oldText=btn.textContent;btn.textContent='正在保存…'});
  await withBusy(async()=>{
    try{
      const result=app.taskWorkflowReady
        ?await db.rpc('save_member_abilities_v3',{p_member_id:id,p_task_ids:ids,p_expected_version:m.abilitiesVersion,p_operator_name:operatorName()})
        :await db.rpc('save_member_abilities',{p_member_id:id,p_task_ids:ids,p_expected_version:m.abilitiesVersion,p_operator_name:operatorName()});
      const {error}=result;
      if(error)throw error;
      const [{data:memberRow,error:memberError},{data:abilityRows,error:abilityError}]=await Promise.all([
        db.from('guild_members').select('*').eq('id',id).single(),
        db.from('member_abilities').select('*').eq('guild_id',app.guild.id).eq('member_id',id)
      ]);
      if(memberError)throw memberError;
      if(abilityError)throw abilityError;
      const memberIndex=app.members.findIndex(x=>x.id===id);
      if(memberIndex>=0)app.members[memberIndex]=memberRow;
      app.abilities=app.abilities.filter(x=>x.member_id!==id).concat(abilityRows||[]);
      abilityDraft=new Set((abilityRows||[]).map(x=>Number(x.task_id)));
      abilityDraftMemberId=id;
      abilityDirty=false;
      syncAbilityCount();
      const memberSearch=document.querySelector('.member-list .input')?.value||'';
      renderMemberList(memberSearch);
      toast(`能力清单已保存，共${abilityDraft.size}项`);
    }catch(e){
      showError(e,'保存失败');
    }finally{
      saveButtons.forEach(btn=>{btn.disabled=false;btn.textContent=btn.dataset.oldText||'保存能力清单';delete btn.dataset.oldText});
    }
  });
}

function resetRecordRequestKey(){recordIdempotencyKey=null}
function setRecordMode(mode){
  if(!['single','batch'].includes(mode)||recordMode===mode)return;
  recordMode=mode;batchSubmitSummary=null;
  if(mode==='batch')ensureBatchRows();
  renderRecordPage();
}
function setRecordMember(id){
  if(recordMemberId!==id){recordMemberId=id;recordTaskId=null;recordSearchQuery='';resetRecordRequestKey()}
  renderRecordPage();
}
function setRecordAttempt(type){
  if(!['free','paid'].includes(type))return;
  if(recordAttemptType!==type){recordAttemptType=type;resetRecordRequestKey()}
  renderRecordPage();
}
function switchRecordToPaid(){
  const m=memberById(recordMemberId),c=currentGuild()?.competition;
  if(!m||!c)return;
  const paidRem=Math.max(0,c.paidLimit-m.paidUsed);
  if(paidRem<=0)return toast(`${m.name}的购买次数也已全部登记`);
  setRecordAttempt('paid');
}
function setRecordDoubled(checked){
  const next=!!checked;if(recordDoubled!==next){recordDoubled=next;resetRecordRequestKey()}
}
function chooseRecordTask(id){
  const next=Number(id);if(recordTaskId!==next){recordTaskId=next;resetRecordRequestKey()}
  renderRecordPage();
}
function recordHistoryHtml(g){
  return `<section class="card" style="padding:21px"><div class="section-title"><div><h2>最近任务记录</h2><p>误操作可以撤销，助手会退回记录中的积分和次数；游戏内已经消耗的钻石不会返还。</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>成员</th><th>任务</th><th>积分</th><th>次数</th><th>状态</th><th>操作</th></tr></thead><tbody>${g.logs.slice(0,100).map(l=>{const mm=memberById(l.memberId);return`<tr><td>${fmtTime(l.time)}</td><td>${esc(mm?.name||'未知')}</td><td>${esc(l.taskName)}</td><td>${l.points}</td><td>${l.attemptType==='paid'?'购买':'免费'}</td><td><span class="pill ${l.reversedAt?'bad':'good'}">${l.reversedAt?'已撤销':l.countsForGuild?'计入公会':'仅个人'}</span></td><td>${l.reversedAt?'—':`<button class="btn btn-sm btn-danger" onclick="confirmReverse('${l.id}')">撤销</button>`}</td></tr>`}).join('')||`<tr><td colspan="7"><div class="empty">还没有任务记录。</div></td></tr>`}</tbody></table></div></section>`;
}
function recordModeTabsHtml(){
  return `<div class="record-mode-tabs"><button class="${recordMode==='single'?'active':''}" onclick="setRecordMode('single')">单次登记</button><button class="${recordMode==='batch'?'active':''}" onclick="setRecordMode('batch')">批量登记</button></div>`;
}
function renderRecordPage(){
  const g=currentGuild(),c=g.competition;
  document.getElementById('page').innerHTML=`<section class="card paper" style="padding:21px;margin-bottom:16px"><div class="section-title"><div><span class="pill lav">当前第${c.round}轮</span><h2 style="margin-top:10px">登记任务完成</h2><p>单次登记适合随手记录；批量登记适合一次补录多名成员、多项任务。</p></div></div>${recordModeTabsHtml()}<div id="recordPanel"></div></section>${recordHistoryHtml(g)}`;
  recordMode==='batch'?renderBatchRecordPanel():renderSingleRecordPanel();
}
function renderSingleRecordPanel(){
  const box=document.getElementById('recordPanel');if(!box)return;
  const g=currentGuild(),c=g.competition,members=g.members.filter(m=>m.active&&m.targetMode!=='inactive');
  if(!recordMemberId&&members.length)recordMemberId=members[0].id;
  if(recordMemberId&&!members.some(x=>x.id===recordMemberId)){recordMemberId=members[0]?.id||null;recordTaskId=null;resetRecordRequestKey()}
  const m=memberById(recordMemberId),allowed=m?tasks().filter(t=>!recordOnlyAbilities||m.abilities.includes(t.id)):[];
  if(recordTaskId&&!allowed.some(t=>t.id===recordTaskId)){recordTaskId=null;resetRecordRequestKey()}
  const freeRem=m?Math.max(0,c.freeLimit-m.freeUsed):0,paidRem=m?Math.max(0,c.paidLimit-m.paidUsed):0;
  const currentRem=recordAttemptType==='paid'?paidRem:freeRem,bothExhausted=!!m&&freeRem<=0&&paidRem<=0,currentExhausted=!!m&&currentRem<=0;
  const resourceAdvice=!m?'':bothExhausted
    ?`<div class="advice bad"><b>${esc(m.name)}本轮免费次数和购买次数均已全部登记</b><br>当前无法继续登记，请先核对游戏内和系统中的次数记录。</div>`
    :recordAttemptType==='free'&&freeRem<=0
      ?`<div class="advice warn"><b>${esc(m.name)}本轮${c.freeLimit}次免费任务已全部登记</b><br>本次如使用钻石次数，请主动切换为“购买次数”。<div style="margin-top:10px"><button class="btn btn-sm btn-butter" onclick="switchRecordToPaid()">切换为购买次数</button></div></div>`
      :recordAttemptType==='paid'&&paidRem<=0
        ?`<div class="advice bad"><b>${esc(m.name)}本轮${c.paidLimit}次购买任务已全部登记</b><br>${freeRem>0?'仍有免费次数，可切换回“免费次数”。':'当前无法继续登记。'}${freeRem>0?`<div style="margin-top:10px"><button class="btn btn-sm btn-soft" onclick="setRecordAttempt('free')">切换为免费次数</button></div>`:''}</div>`
        :`<div class="advice ${recordAttemptType==='paid'?'warn':'good'}"><b>本次使用${recordAttemptType==='paid'?'购买次数':'免费次数'}</b><br>${recordAttemptType==='paid'?'该类型会消耗游戏内钻石，请确认后再登记。':'当前仍可登记 '+freeRem+' 次免费任务。'}</div>`;
  box.innerHTML=members.length?`<div class="grid grid-4" style="margin-bottom:14px"><div class="person-stat"><b>${m?.freeUsed||0}/${c.freeLimit}</b><span>免费已用</span></div><div class="person-stat"><b>${freeRem}</b><span>免费剩余</span></div><div class="person-stat"><b>${m?.paidUsed||0}/${c.paidLimit}</b><span>购买已用</span></div><div class="person-stat"><b>${paidRem}</b><span>购买剩余</span></div></div><div class="grid grid-3"><div><label class="label">完成成员</label><select id="recordMember" class="select" onchange="setRecordMember(this.value)">${members.map(x=>`<option value="${x.id}" ${x.id===recordMemberId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label class="label">次数类型</label><select id="recordAttempt" class="select" onchange="setRecordAttempt(this.value)"><option value="free" ${recordAttemptType==='free'?'selected':''}>免费次数</option><option value="paid" ${recordAttemptType==='paid'?'selected':''}>购买次数</option></select></div><div><label class="label">积分翻倍</label><label class="input" style="display:flex;gap:10px;align-items:center"><input id="recordDoubled" type="checkbox" ${recordDoubled?'checked':''} onchange="setRecordDoubled(this.checked)"> 本次任务已翻倍</label></div></div>${resourceAdvice}<div style="margin-top:14px"><label class="label">任务</label><div class="row" style="margin-bottom:9px"><button class="btn btn-sm ${recordOnlyAbilities?'btn-soft':'btn-ghost'}" onclick="recordOnlyAbilities=true;recordTaskId=null;resetRecordRequestKey();renderSingleRecordPanel()">只看已登记能力</button><button class="btn btn-sm ${!recordOnlyAbilities?'btn-soft':'btn-ghost'}" onclick="recordOnlyAbilities=false;renderSingleRecordPanel()">查看全部任务</button></div><input class="input" value="${esc(recordSearchQuery)}" placeholder="输入一个字筛选任务" oninput="recordSearchQuery=this.value;renderRecordTaskChoices(this.value)"><div id="recordTaskChoices" class="result-list" style="margin-top:10px;max-height:330px;overflow:auto"></div></div>${recordTaskId?(()=>{const t=taskById(recordTaskId);const award=t.points*(recordDoubled?2:1);return`<div class="advice good"><b>已选择：${esc(t.name)}</b><br>本次预计登记 ${award} 分（${recordDoubled?'已翻倍':'未翻倍'}）。</div>`})():''}<button id="recordSubmitButton" class="btn btn-primary" style="width:100%" onclick="submitTaskCompletion()" ${!recordTaskId||currentExhausted||submitLocked?'disabled':''}>${currentExhausted?'当前次数不可用':submitLocked?'正在登记，请勿重复点击…':'确认完成并同步云端'}</button>`:`<div class="empty">当前没有可参与本轮的有效成员。</div>`;
  renderRecordTaskChoices(recordSearchQuery);
}
function renderRecordTaskChoices(q){
  const box=document.getElementById('recordTaskChoices');if(!box)return;
  const m=memberById(recordMemberId);
  let list=tasks().filter(t=>(!q||norm(t.name).includes(norm(q)))&&(!recordOnlyAbilities||m?.abilities.includes(t.id))).sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name,'zh-CN')).slice(0,80);
  box.innerHTML=list.length?list.map(t=>`<button class="result-item" style="width:100%;text-align:left;${recordTaskId===t.id?'border-color:#d5b878;background:var(--amber-soft)':''}" onclick="chooseRecordTask(${t.id})"><div class="result-main"><strong>${esc(t.name)} ${taskOriginBadge(t)}</strong><small>${t.points}分 · 翻倍${t.points*2}</small></div><span>›</span></button>`).join(''):`<div class="missing-task-box"><b>没有匹配任务</b><span class="small muted">${recordOnlyAbilities?'可以先切换“查看全部任务”；确认任务库确实没有时再新增。':'填写名称和基础分后，本公会可以立即登记。'}</span><br><button class="btn btn-sm btn-primary" onclick="openGuildTaskSubmissionModal('${esc(q||'')}')">新增缺失任务</button></div>`;
}
async function submitTaskCompletion(){
  if(!ensureMaintain())return;if(submitLocked||!recordTaskId||!recordMemberId)return;
  const m=memberById(recordMemberId),c=currentGuild().competition;if(!m)return;
  const remaining=recordAttemptType==='paid'?Math.max(0,c.paidLimit-m.paidUsed):Math.max(0,c.freeLimit-m.freeUsed);
  if(remaining<=0){renderSingleRecordPanel();return toast(`${m.name}的${recordAttemptType==='paid'?'购买':'免费'}次数已用完`)}
  if(!recordIdempotencyKey)recordIdempotencyKey=uuid();
  submitLocked=true;renderSingleRecordPanel();
  try{
    const {data,error}=await db.rpc('record_task_completion',{p_member_id:recordMemberId,p_task_id:recordTaskId,p_doubled:recordDoubled,p_attempt_type:recordAttemptType,p_operator_name:operatorName(),p_idempotency_key:recordIdempotencyKey});
    if(error)throw error;
    await loadGuildData(app.guild.id,true);recordTaskId=null;recordSearchQuery='';recordIdempotencyKey=null;
    toast(data.duplicate?'该操作已登记过':'任务已登记并同步');renderRecordPage();
  }catch(e){
    const raw=e?.message||String(e||'');
    try{await loadGuildData(app.guild.id,true)}catch(_){}
    if(raw.includes('FREE_ATTEMPTS_EXHAUSTED'))toast(`${memberById(recordMemberId)?.name||'该成员'}的免费次数已用完，可切换为购买次数`);
    else if(raw.includes('PAID_ATTEMPTS_EXHAUSTED'))toast(`${memberById(recordMemberId)?.name||'该成员'}的购买次数已用完`);
    else showError(e,'登记失败');
    renderRecordPage();
  }finally{submitLocked=false}
}

function newBatchRecordRow(seed={}){
  const members=currentGuild()?.members.filter(m=>m.active&&m.targetMode!=='inactive')||[];
  const memberId=seed.memberId&&members.some(m=>m.id===seed.memberId)?seed.memberId:(members[0]?.id||null);
  return{id:uuid(),memberId,attemptType:seed.attemptType||'free',doubled:seed.doubled??true,taskId:Number(seed.taskId)||null,query:seed.query||'',idempotencyKey:uuid(),error:'',status:'pending'};
}
function ensureBatchRows(){if(!batchRecordRows.length)batchRecordRows=[newBatchRecordRow()]}
function addBatchRecordRow(copyLast=false){
  ensureBatchRows();const seed=copyLast?batchRecordRows.at(-1):{};batchRecordRows.push(newBatchRecordRow(seed));batchSubmitSummary=null;renderBatchRecordRows();
}
function copyBatchRecordRow(id){const row=batchRecordRows.find(x=>x.id===id);if(!row)return;const index=batchRecordRows.findIndex(x=>x.id===id);batchRecordRows.splice(index+1,0,newBatchRecordRow(row));batchSubmitSummary=null;renderBatchRecordRows()}
function deleteBatchRecordRow(id){if(batchSubmitting)return;batchRecordRows=batchRecordRows.filter(x=>x.id!==id);ensureBatchRows();batchSubmitSummary=null;renderBatchRecordRows()}
function updateBatchRecordRow(id,field,value){
  const row=batchRecordRows.find(x=>x.id===id);if(!row||batchSubmitting)return;
  if(field==='memberId'){row.memberId=value;row.taskId=null;row.query=''}
  else if(field==='attemptType')row.attemptType=value;
  else if(field==='doubled')row.doubled=!!value;
  else if(field==='taskId')row.taskId=Number(value)||null;
  else if(field==='query')row.query=value;
  row.idempotencyKey=uuid();row.error='';row.status='pending';batchSubmitSummary=null;renderBatchRecordRows();
}
function setBatchOnlyAbilities(value){batchOnlyAbilities=!!value;batchRecordRows.forEach(row=>{const allowed=batchTasksForRow(row);if(row.taskId&&!allowed.some(t=>t.id===row.taskId))row.taskId=null});batchSubmitSummary=null;renderBatchRecordPanel()}
function batchTasksForRow(row){
  const m=memberById(row.memberId),q=norm(row.query||'');
  return tasks().filter(t=>(!batchOnlyAbilities||m?.abilities.includes(t.id))&&(!q||norm(t.name).includes(q))).sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name,'zh-CN'));
}
function batchRowErrorText(raw,row){
  const m=memberById(row.memberId),name=m?.name||'该成员',s=raw?.message||String(raw||'');
  if(s.includes('FREE_ATTEMPTS_EXHAUSTED'))return`${name}的免费次数已用完`;
  if(s.includes('PAID_ATTEMPTS_EXHAUSTED'))return`${name}的购买次数已用完`;
  if(s.includes('TASK_NOT_FOUND_OR_INACTIVE'))return'该任务已停用或不存在';
  if(s.includes('MEMBER_NOT_FOUND_OR_INACTIVE'))return'该成员已停用或不存在';
  if(s.includes('CURRENT_ROUND_NOT_FOUND'))return'当前轮次不存在，请刷新后重试';
  if(s.includes('ACCESS_DENIED'))return'当前账号没有登记权限';
  return s||'登记失败';
}
function validateBatchRecordRows(){

async function submitBatchTaskCompletions(){

function loadImageFile(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>resolve({img,url});img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('图片读取失败'))};img.src=url})}
function makeOcrCrop(img,rect,kind){
  const sx=Math.max(0,Math.round(img.naturalWidth*rect.x)),sy=Math.max(0,Math.round(img.naturalHeight*rect.y));

  const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.filter=kind==='score'?'grayscale(1) contrast(2.05) brightness(1.12)':'grayscale(1) contrast(1.65) brightness(1.08)';ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);ctx.filter='none';

}
function parseOcrScore(text){
  const nums=(String(text||'').match(/[0-9][0-9,，.\s]*/g)||[]).map(x=>Number(x.replace(/[^0-9]/g,''))).filter(Number.isFinite);
  return nums.length?Math.max(...nums):0;

function parseOcrGuildName(text){
  const lines=String(text||'').split(/\n+/).map(x=>x.replace(/[|｜_—=【】\[\]（）()]/g,'').trim()).filter(Boolean);
  const ranked=lines.map(x=>({raw:x,score:(x.match(/[\u3400-\u9fff]/g)||[]).length*3+(x.match(/[A-Za-z]/g)||[]).length-(x.match(/[0-9]/g)||[]).length*2})).sort((a,b)=>b.score-a.score);
  let value=(ranked[0]?.raw||'').replace(/^第?[一二三四五12345]\s*名?/,'').replace(/[0-9]+$/,'').trim();
  return value.slice(0,24);
}

  const firstText=firstMax>0?`若${esc(opponentName)}在未来${x.observeHours}小时内增分不超过${fmt(firstMax)}分`:`若${esc(opponentName)}在未来${x.observeHours}小时内基本没有继续增分`;
  const secondStart=firstMax+1,secondText=secondMax>=secondStart?`若增分在${fmt(secondStart)}至${fmt(secondMax)}分之间`:`若对手增分已经超过免费资源可覆盖范围`;
  return `<div class="branch-list"><div class="branch-item"><b>${firstText}</b>继续优先清免费次数，暂不购买。${x.freeBuffer>0?`当前免费方案在参考目标之上还有约${fmt(x.freeBuffer)}分空间。`:''}</div><div class="branch-item"><b>${secondText}</b>按“超出免费缓冲的分数 ÷ 当前平均每次${fmt(x.avgAward)}分”计算购买次数，分批补回参考线，不一次用完全部资源。</div><div class="branch-item"><b>若增分超过${fmt(secondMax)}分且仍在加速</b>重新保存排行榜并重算参考目标。第一批只补回安全线，确认对手是否继续加速后再决定下一批。</div></div>`;

function exportGuildData(){const data={type:'guildBidAssistantCloudBackup',version:3,exportedAt:new Date().toISOString(),guild:app.guild,round:app.round,members:app.members,abilities:app.abilities,stats:app.stats,competitors:app.competitors,logs:app.logs,audits:app.audits,taskLibrary:app.taskLibrary};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${app.guild.name}_竞标赛助手云端备份_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}

function exportGuildCsv(type){
  const g=currentGuild(),date=new Date().toISOString().slice(0,10);
  if(type==='members')return downloadCsv(`${g.name}_成员名单_${date}.csv`,['成员ID','姓名','在会','状态','目标模式','目标积分','当前积分','免费已用','购买已用','备注'],g.members.map(m=>[m.id,m.name,m.active?'是':'否',m.status,targetModeLabel(m.targetMode),m.goal,m.currentPoints,m.freeUsed,m.paidUsed,m.note]));
  if(type==='abilities')return downloadCsv(`${g.name}_成员能力_${date}.csv`,['成员','任务ID','任务名称','基础分'],g.members.flatMap(m=>m.abilities.map(id=>{const t=taskById(id);return[m.name,id,t?.name||'已失效任务',t?.points??'']})));
  if(type==='logs')return downloadCsv(`${g.name}_第${g.competition.round}轮任务记录_${date}.csv`,['时间','成员','任务','基础分','是否翻倍','实际得分','次数类型','是否计入公会','是否撤销','操作者'],g.logs.map(l=>[fmtTime(l.time),memberById(l.memberId)?.name||'未知',l.taskName,l.basePoints,l.doubled?'是':'否',l.points,l.attemptType==='paid'?'购买':'免费',l.countsForGuild?'是':'否',l.reversedAt?'是':'否',l.operator]));
  if(type==='snapshots')return downloadCsv(`${g.name}_排行榜快照_${date}.csv`,['快照时间','公会','积分','是否我方','备注'],app.snapshots.flatMap(s=>(s.competitors||[]).map(r=>[fmtTime(s.captured_at),r.name,r.score,r.is_self?'是':'否',s.note||''])));
  if(type==='tasks')return downloadCsv(`${g.name}_当前可用任务_${date}.csv`,['任务ID','任务名称','基础分','翻倍分','来源','审核状态'],tasks().map(t=>[t.id,t.name,t.points,t.points*2,t.visibility==='guild'?'本公会补充':'公共任务',t.reviewStatus]));
}
function openResetRoundModal(){const g=currentGuild();openModal(`<div class="modal-head"><div><h3>开始新一轮</h3><p class="muted">系统会把当前轮次归档，不会删除成员能力。</p></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="advice warn"><b>会重置</b><br>当前积分、已用次数、临时状态、五个公会积分和本轮任务完成数。</div><div class="advice good"><b>会保留</b><br>成员名单、可完成任务、备注、任务明细历史和操作记录。</div><label class="label">下一轮所在赛段</label><select id="nextStage" class="select">${g.stageNames.map((s,i)=>`<option value="${i+1}" ${g.competition.currentStage===i+1?'selected':''}>${esc(s)}</option>`).join('')}</select><div style="height:12px"></div><label class="label">输入“开始新一轮”确认</label><input id="resetText" class="input" placeholder="开始新一轮"><button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="resetRound()">确认开始</button>`)}
async function resetRound(){if(!ensureMaintain())return;if(document.getElementById('resetText').value.trim()!=='开始新一轮')return toast('请按提示输入确认文字');await withBusy(async()=>{try{const {error}=await db.rpc('start_new_round_v2',{p_next_stage:Number(document.getElementById('nextStage').value),p_operator_name:operatorName(),p_guild_id:app.role==='admin'?app.guild.id:null});if(error)throw error;closeModal();await loadGuildData(app.guild.id);toast('新一轮已开始，旧数据已归档');renderApp(app.role==='admin')}catch(e){showError(e,'开始新一轮失败')}})}

boot();
</script>
</body>
