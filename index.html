<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公会竞标赛助手</title>
<style>
:root{
  --bg:#fff9f0;--paper:#fffefb;--ink:#403845;--muted:#837986;--line:#eadfd7;
  --peach:#ee9f91;--peach-deep:#d8786c;--peach-soft:#fff0eb;
  --lav:#a895cf;--lav-deep:#735fa4;--lav-soft:#f2edfb;
  --sage:#7fa88a;--sage-soft:#edf7ef;--butter:#ecc86f;--butter-soft:#fff7dc;

  --shadow:0 12px 34px rgba(98,73,68,.09);--shadow-sm:0 7px 18px rgba(98,73,68,.07);
  --radius:22px;--radius-sm:14px;
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:
radial-gradient(circle at 8% 3%,rgba(238,159,145,.18),transparent 25%),
radial-gradient(circle at 96% 8%,rgba(168,149,207,.17),transparent 25%),
linear-gradient(180deg,#fff9f0,#fffdf8 52%,#fff8ef)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.grow{flex:1}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:rgba(255,254,251,.97);border:1px solid rgba(234,223,215,.96);border-radius:var(--radius);box-shadow:var(--shadow)}
.paper{position:relative;overflow:hidden}.paper:after{content:"✦";position:absolute;right:18px;top:12px;color:rgba(168,149,207,.22);font-size:24px;pointer-events:none}
.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:750;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.17s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--peach),#f2b5a8);color:#fff;box-shadow:0 8px 18px rgba(216,120,108,.19)}
.btn-primary:hover{background:linear-gradient(135deg,var(--peach-deep),var(--peach))}
.btn-soft{background:var(--lav-soft);color:var(--lav-deep)}.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:var(--rose-soft);color:var(--rose)}.btn-success{background:var(--sage-soft);color:#4d7a57}.btn-butter{background:var(--butter-soft);color:#987019}
.btn-sm{padding:7px 11px;border-radius:11px;font-size:13px;min-height:34px}
.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#fffdfb;color:var(--ink);padding:12px 14px;outline:none;transition:.17s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--peach);box-shadow:0 0 0 4px rgba(238,159,145,.13)}.textarea{min-height:112px;resize:vertical}
.label{display:block;font-size:13px;font-weight:750;margin-bottom:7px;color:#594f5b}.helper{font-size:12px;color:var(--muted);line-height:1.55}
.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.section-title{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:0 0 16px}.section-title h2,.section-title h3{margin:0}.section-title p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
.divider{height:1px;background:var(--line);margin:18px 0}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed #dbcfc7;border-radius:18px;background:#fffcf8;line-height:1.8}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:750;background:#f5efeb;color:#6e626d;vertical-align:middle}
.pill.high{background:var(--butter-soft);color:#966e14}.pill.good{background:var(--sage-soft);color:#4b7955}.pill.bad{background:var(--rose-soft);color:var(--rose)}.pill.blue{background:var(--blue-soft);color:#527c97}.pill.lav{background:var(--lav-soft);color:var(--lav-deep)}
.kpi{padding:18px;position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;width:64px;height:64px;border-radius:50%;right:-18px;bottom:-22px;background:rgba(238,159,145,.11)}.kpi b{display:block;font-size:28px;margin-top:8px}.kpi span{font-size:13px;color:var(--muted)}
.callout{padding:14px 16px;border-radius:16px;background:var(--butter-soft);color:#795a20;line-height:1.7;border:1px solid #f0dfae}
.advice{padding:15px 16px;border-radius:16px;background:var(--blue-soft);color:#466e87;line-height:1.7;margin:14px 0;border:1px solid rgba(108,151,180,.18)}
.advice.warn{background:var(--butter-soft);color:#80601d;border-color:#eedb9a}.advice.bad{background:var(--rose-soft);color:#9e4452;border-color:#f2ccd2}.advice.good{background:var(--sage-soft);color:#477351;border-color:#cee5d3}.advice.lav{background:var(--lav-soft);color:#6b5797;border-color:#ded4f2}
.toast{position:fixed;left:50%;bottom:26px;z-index:9999;transform:translate(-50%,20px);opacity:0;background:#4b414d;color:#fff;padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-mask{position:fixed;inset:0;background:rgba(54,44,55,.39);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;backdrop-filter:blur(4px)}
.modal{width:min(690px,100%);max-height:90vh;overflow:auto;background:#fffdf9;border-radius:24px;padding:24px;box-shadow:0 24px 80px rgba(50,38,53,.24);border:1px solid rgba(255,255,255,.8)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.modal-head h2,.modal-head h3{margin:0}.modal-close{width:36px;height:36px;border:0;border-radius:50%;background:#f6efeb;color:#6f626d;font-size:20px;flex:0 0 auto}
.footer-note{max-width:1180px;margin:28px auto 0;padding:24px 18px 28px;text-align:center;color:#8c8089;font-size:12px;line-height:1.85;border-top:1px dashed #dfd1c9}.footer-note button{border:0;background:transparent;color:#7561a3;padding:0;text-decoration:underline;text-underline-offset:3px}

/* 登录 */
.landing{min-height:100vh;padding:30px 20px;display:flex;flex-direction:column;justify-content:center}.landing-wrap{width:min(960px,100%);margin:auto}.landing-box{display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}
.landing-brand{padding:46px;background:linear-gradient(145deg,#f1a496,#c0acdD);color:#fff;position:relative;overflow:hidden}.landing-brand:before{content:"✦  ✧  ✦";position:absolute;right:26px;top:20px;letter-spacing:8px;opacity:.36}.landing-brand:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-100px;bottom:-115px;background:rgba(255,255,255,.15)}
.brand-mark{width:58px;height:58px;border-radius:19px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:30px;margin-bottom:25px;border:1px solid rgba(255,255,255,.3)}
.landing-brand h1{font-size:35px;line-height:1.25;margin:0 0 14px}.landing-brand p{line-height:1.85;opacity:.95}.feature-list{display:grid;gap:11px;margin-top:28px}.feature-list div{display:flex;gap:9px;align-items:center;font-size:14px}.feature-dot{width:24px;height:24px;border-radius:9px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.landing-form{padding:42px;background:#fffdf9}.landing-form h2{margin:0 0 7px}.tabs{display:flex;background:#f6efeb;border-radius:14px;padding:4px;margin:22px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;color:var(--muted);font-weight:750}.tabs button.active{background:#fff;color:var(--peach-deep);box-shadow:var(--shadow-sm)}
.login-mini-footer{margin-top:22px;padding-top:17px;border-top:1px dashed var(--line);text-align:center;font-size:11px;color:#92868e;line-height:1.75}.login-mini-footer button{border:0;background:none;color:#7561a3;text-decoration:underline;padding:0}

/* 管理端 */
.admin-shell{max-width:1120px;margin:0 auto;padding:30px 22px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.admin-head h1{margin:0}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.admin-tabs button.active{background:var(--peach-soft);color:var(--peach-deep);border-color:#efbeb5}.guild-admin-item{padding:17px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-bottom:12px}.guild-admin-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* 应用 */
.app-shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.sidebar{padding:20px 14px;border-right:1px solid var(--line);background:rgba(255,253,248,.89);backdrop-filter:blur(13px);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.app-brand{padding:8px 10px 20px;display:flex;gap:10px;align-items:center}.app-brand-logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(135deg,var(--peach),var(--lav));color:#fff;display:grid;place-items:center;font-weight:850;box-shadow:var(--shadow-sm)}.app-brand strong{display:block}.app-brand small{color:var(--muted)}
.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:13px;color:#695f6b;font-weight:700}.nav button.active{background:linear-gradient(135deg,var(--peach-soft),var(--lav-soft));color:#7a5669}.nav button:hover{background:#fbf4ef}.side-bottom{margin-top:auto}.guild-mini{padding:13px;background:#fbf4ef;border-radius:14px;margin-bottom:9px}.guild-mini strong,.guild-mini small{display:block}.guild-mini small{margin-top:4px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}.topbar{min-height:74px;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);background:rgba(255,249,240,.89);backdrop-filter:blur(13px);position:sticky;top:0;z-index:20}.topbar h1{font-size:20px;margin:0}.top-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.content{padding:24px 28px 38px;max-width:1280px;width:100%;margin:0 auto;flex:1}
.search-hero{padding:23px;background:linear-gradient(135deg,#fffdf9,#fff1ec 52%,#f3eefb);margin-bottom:18px}.search-box{position:relative}.search-box input{padding:16px 18px 16px 47px;font-size:16px}.search-icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--peach-deep);font-size:20px}
.result-group{margin:19px 0}.result-list{display:grid;gap:10px}.result-item{padding:14px 15px;border:1px solid var(--line);border-radius:16px;background:#fffefb;display:flex;justify-content:space-between;gap:12px;align-items:center;transition:.16s}.result-item:hover{border-color:#e6b9b0;box-shadow:var(--shadow-sm);transform:translateY(-1px)}.result-main{min-width:0}.result-main strong{display:block}.result-main small{display:block;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-side{display:flex;gap:7px;align-items:center;flex-shrink:0}
.task-detail{padding:21px;margin-top:18px}.task-title-row{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.task-title-row h2{margin:0 0 9px}.strategy-row,.filter-row{display:flex;gap:8px;flex-wrap:wrap}.strategy-btn,.filter-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;color:var(--muted);font-weight:700}.strategy-btn.active,.filter-btn.active{background:var(--peach-soft);border-color:#efb8ae;color:var(--peach-deep)}
.candidate{padding:14px;border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;margin:9px 0;background:#fffefb}.rank-badge{width:36px;height:36px;border-radius:12px;background:var(--lav-soft);color:var(--lav-deep);display:grid;place-items:center;font-weight:850}.candidate strong{display:block}.candidate small{color:var(--muted);display:block;margin-top:4px;line-height:1.55}.candidate-actions{text-align:right}
.member-layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px}.member-list{padding:15px;max-height:calc(100vh - 148px);overflow:auto;position:sticky;top:90px}.member-row{width:100%;border:0;background:transparent;padding:12px;border-radius:13px;text-align:left;display:flex;justify-content:space-between;gap:8px}.member-row:hover,.member-row.active{background:linear-gradient(135deg,var(--peach-soft),var(--lav-soft))}.member-row small{display:block;color:var(--muted);margin-top:3px}.member-editor{padding:21px;min-width:0}
.task-save-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;background:#fff7f0;border:1px solid #f1d4cb;border-radius:16px;margin:12px 0;position:sticky;top:84px;z-index:8}.task-toolbar{display:grid;grid-template-columns:1.45fr .65fr auto;gap:9px;margin:14px 0}.task-check-groups{max-height:650px;overflow:auto;padding-right:4px}.point-group{margin:15px 0}.point-group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 9px;padding:0 3px}.point-group-head h4{margin:0}.task-check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.task-check{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start;background:#fffefb;cursor:pointer;transition:.15s}.task-check:hover{border-color:#e6b9b0}.task-check.selected{background:linear-gradient(135deg,#fff1ec,#f4effb);border-color:#e2b3ab;box-shadow:var(--shadow-sm)}.task-check input{margin-top:3px;accent-color:var(--peach-deep)}.task-check strong{font-size:13px;display:block;line-height:1.45}.task-check small{color:var(--muted);display:block;margin-top:4px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.table th{background:#fbf3ee;color:#665966;position:sticky;top:0}.table tr:last-child td{border-bottom:0}.table input,.table select{border:1px solid var(--line);border-radius:9px;padding:7px 8px;width:100%;background:#fff}
.log-item{padding:13px 14px;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0;background:#fffefb}.log-main strong{display:block}.log-main small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}
.person-card{padding:18px}.person-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.person-head h3{margin:0}.person-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.person-stat{padding:10px;background:#fbf5f0;border-radius:12px}.person-stat b{display:block;font-size:17px}.person-stat span{font-size:11px;color:var(--muted)}.progress{height:9px;border-radius:999px;background:#eee5df;overflow:hidden}.progress>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--peach),var(--lav))}

@media(max-width:900px){
 .landing-box{grid-template-columns:1fr}.landing-brand{padding:32px}.landing-brand h1{font-size:29px}.landing-form{padding:30px}
 .app-shell{display:block}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}.app-brand{padding:6px 4px 10px}.nav{display:flex;overflow:auto;gap:6px;padding-bottom:3px}.nav button{white-space:nowrap;padding:10px 12px}.side-bottom{display:none}.topbar{position:sticky;top:0;padding:10px 15px;min-height:62px}.content{padding:16px 14px 30px}
 .member-layout{grid-template-columns:1fr}.member-list{position:relative;top:auto;max-height:none}.task-check-grid{grid-template-columns:1fr}.task-toolbar{grid-template-columns:1fr 1fr}.task-toolbar .wide{grid-column:1/-1}.task-save-bar{top:67px}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.candidate{grid-template-columns:38px 1fr}.candidate-actions{grid-column:2;text-align:left}.guild-admin-item{grid-template-columns:1fr}.guild-admin-actions{justify-content:flex-start}.admin-head{align-items:flex-start}.person-stats{grid-template-columns:1fr 1fr}
}
@media(max-width:580px){
 .landing{padding:14px}.landing-brand{padding:28px 24px}.landing-brand p{font-size:14px}.landing-form{padding:26px 21px}.feature-list{margin-top:20px}
 .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.topbar{align-items:flex-start}.top-meta .hide-phone{display:none}.topbar h1{font-size:18px}.section-title{flex-direction:column}.section-title>div:last-child{width:100%}.section-title .btn{width:100%}.task-title-row{display:block}.task-title-row .btn{margin-top:12px}.result-item{align-items:flex-start}.result-side{flex-direction:column;align-items:flex-end}.result-main small{white-space:normal}.task-toolbar{grid-template-columns:1fr}.task-toolbar .wide{grid-column:auto}.task-save-bar{position:relative;top:auto;align-items:flex-start;flex-direction:column}.task-save-bar .btn{width:100%}.candidate{grid-template-columns:34px 1fr}.person-head{display:block}.person-head .pill{margin-top:8px}.modal{padding:19px}.admin-shell{padding:18px 13px}.guild-admin-actions .btn{flex:1}.footer-note{font-size:11px}.kpi b{font-size:25px}
}

.loading-screen{min-height:100vh;display:grid;place-items:center;padding:24px}.loading-card{padding:34px;text-align:center;max-width:430px;width:100%}.spinner{width:44px;height:44px;border:4px solid #f1dfd8;border-top-color:var(--peach);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 17px}@keyframes spin{to{transform:rotate(360deg)}}
.cloud-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#4d7a57;background:var(--sage-soft);padding:5px 9px;border-radius:999px}.cloud-dot{width:7px;height:7px;border-radius:50%;background:#6da47a;box-shadow:0 0 0 4px rgba(109,164,122,.12)}
.error-box{padding:14px 16px;border-radius:15px;background:var(--rose-soft);color:var(--rose);line-height:1.65;margin-bottom:14px;border:1px solid #f0ccd2}
.member-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}.member-list{max-height:720px;overflow:auto;padding:9px}.member-list button{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:13px;margin-bottom:4px;color:var(--ink)}.member-list button:hover{background:#fbf4ef}.member-list button.active{background:linear-gradient(135deg,var(--peach-soft),var(--lav-soft));color:#73586c}.member-list button small{display:block;margin-top:4px;color:var(--muted)}
.task-toolbar{display:grid;grid-template-columns:minmax(200px,1fr) auto auto auto;gap:9px;align-items:center}.task-toolbar .wide{min-width:0}.task-groups{display:grid;gap:15px;margin-top:15px}.task-group h4{margin:0 0 9px;font-size:14px;color:#685d69}.task-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.task-check{border:1px solid var(--line);border-radius:15px;background:#fffdfb;padding:12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:.16s}.task-check:hover{border-color:#dfc9c1;transform:translateY(-1px)}.task-check.checked{background:linear-gradient(135deg,var(--peach-soft),var(--lav-soft));border-color:#dec8d3}.task-check input{margin-top:4px;accent-color:var(--peach-deep);width:18px;height:18px}.task-check strong{display:block;font-size:14px;line-height:1.45}.task-check small{display:block;color:var(--muted);margin-top:4px}.task-save-bar{position:sticky;bottom:10px;z-index:12;margin-top:16px;padding:13px 15px;background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:12px;backdrop-filter:blur(10px)}

async function withBusy(fn){if(busy)return;busy=true;try{await fn()}finally{busy=false}}

async function enterFromSession(){const {data,error}=await db.rpc('get_app_context');if(error)throw error;app.context=data;app.role=data.role;if(data.role==='admin'){await loadAdminData();renderAdmin();return}if(data.role==='guild'){await loadGuildData(data.guild.id);renderApp();if(sessionStorage.getItem(DISCLAIMER_KEY)!=='1')setTimeout(()=>showDisclaimer(true),80);return}await db.auth.signOut();app.session=null;renderLanding(data.role==='disabled'?'该公会已暂停使用，请联系小妙。':'这个账号尚未绑定授权公会。')}

function renderLanding(error=''){const last=localStorage.getItem(LAST_CODE_KEY)||'';document.getElementById('root').innerHTML=`<div class="landing"><div class="landing-wrap"><div class="landing-box card"><section class="landing-brand"><div class="brand-mark">竞</div><h1>公会竞标赛助手</h1><p>把难翻的共享表格，变成随手可查的任务小手账。查谁能做、该不该删、任务给谁更合适，都在这里慢慢算清楚。</p><div class="feature-list"><div><span class="feature-dot">✓</span>输入“夏”也能找到相关任务</div><div><span class="feature-dot">✓</span>完整任务清单，多选登记能力</div><div><span class="feature-dot">✓</span>兼顾个人目标与公会排名</div><div><span class="feature-dot">✓</span>云端保存，多设备同步</div></div></section><section class="landing-form"><span class="pill high">授权公会专用</span><h2 style="margin-top:12px">欢迎回来</h2><p class="muted">没有公开注册入口，公会码由小妙统一发放。</p>${error?`<div class="error-box">${esc(error)}</div>`:''}<div class="tabs"><button class="${landingTab==='guild'?'active':''}" onclick="switchLandingTab('guild')">公会进入</button><button class="${landingTab==='admin'?'active':''}" onclick="switchLandingTab('admin')">小妙管理</button></div>${landingTab==='guild'?`<div><label class="label">公会码</label><input id="loginCode" class="input" autocomplete="off" value="${esc(last)}" placeholder="请输入公会码"><div style="height:12px"></div><label class="label">访问密码</label><input id="loginPass" class="input" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')guildLogin()"><button class="btn btn-primary" style="width:100%;margin-top:18px" onclick="guildLogin()">进入公会 ✦</button></div>`:`<div><label class="label">管理员邮箱</label><input id="adminEmail" class="input" type="email" placeholder="请输入管理员邮箱"><div style="height:12px"></div><label class="label">管理员密码</label><input id="adminPass" class="input" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')adminLogin()"><button class="btn btn-primary" style="width:100%;margin-top:18px" onclick="adminLogin()">进入小妙管理端</button></div>`}<div class="login-mini-footer">一位因公会竞标赛深受其害的小妙女士，无偿倾情制作<br>有事漂流瓶联系 · 祝大家天天开心<br><br>仅供授权公会内部使用｜任务库版本：${esc(app.taskLibrary.version||'2026.06')}｜<button onclick="showDisclaimer(false)">免责声明</button></div></section></div></div></div>`}
async function guildLogin(){await withBusy(async()=>{const code=document.getElementById('loginCode').value.trim().toUpperCase(),password=document.getElementById('loginPass').value;if(!code||!password)return toast('请填写公会码和密码');showLoading('正在验证公会码…');try{const {data:email,error:e1}=await db.rpc('resolve_guild_login',{p_code:code});if(e1)throw e1;if(!email)throw new Error('公会码不存在或已暂停');const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;app.session=data.session;localStorage.setItem(LAST_CODE_KEY,code);await enterFromSession()}catch(e){await db.auth.signOut();renderLanding();showError(e,'登录失败')}})}
async function adminLogin(){await withBusy(async()=>{const email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPass').value;if(!email||!password)return toast('请填写管理员邮箱和密码');showLoading('正在进入小妙管理端…');try{const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;app.session=data.session;const {data:ctx,error:e2}=await db.rpc('get_app_context');if(e2)throw e2;if(!ctx.is_admin){await db.auth.signOut();throw new Error('这个账号不是小妙总管理员')}app.context=ctx;app.role='admin';await loadAdminData();renderAdmin()}catch(e){renderLanding();showError(e,'登录失败')}})}
async function logout(){await db.auth.signOut();app={...app,session:null,context:null,role:null,guild:null,round:null,members:[],abilities:[],stats:[],competitors:[],logs:[],audits:[]};sessionStorage.removeItem(DISCLAIMER_KEY);activeTab='search';renderLanding()}

async function loadTaskLibrary(includeInactive=false){const tq=db.from('tasks').select('*').order('base_points',{ascending:false}).order('sort_order').order('id');if(!includeInactive)tq.eq('active',true);const [{data:tasks,error:e1},{data:setting,error:e2}]=await Promise.all([tq,db.from('app_settings').select('*').eq('key','task_library').maybeSingle()]);if(e1)throw e1;if(e2)throw e2;app.tasks=tasks||[];const v=setting?.value||{};app.taskLibrary={version:v.version||'2026.06',updatedAt:v.updated_at||setting?.updated_at||null}}
async function loadAdminData(){await loadTaskLibrary(true);const {data,error}=await db.from('guilds').select('*').order('created_at',{ascending:false});if(error)throw error;app.adminGuilds=data||[]}
async function loadGuildData(guildId){showLoading('正在同步公会数据…');const [{data:g,error:eg},{data:r,error:er}]=await Promise.all([db.from('guilds').select('*').eq('id',guildId).single(),db.from('competition_rounds').select('*').eq('guild_id',guildId).eq('status','current').single()]);if(eg)throw eg;if(er)throw er;app.guild=g;app.round=r;await loadTaskLibrary(app.role==='admin');const [m,a,s,c,l,u,h]=await Promise.all([
 db.from('guild_members').select('*').eq('guild_id',guildId).order('active',{ascending:false}).order('name'),
 db.from('member_abilities').select('*').eq('guild_id',guildId),
 db.from('member_round_stats').select('*').eq('round_id',r.id),
 db.from('round_competitors').select('*').eq('round_id',r.id).order('arrival_order'),
 db.from('task_logs').select('*').eq('round_id',r.id).order('created_at',{ascending:false}).limit(300),
 db.from('audit_logs').select('*').eq('guild_id',guildId).order('created_at',{ascending:false}).limit(100),
 db.from('competition_rounds').select('*',{count:'exact',head:true}).eq('guild_id',guildId).eq('status','archived')
]);for(const x of [m,a,s,c,l,u,h])if(x.error)throw x.error;app.members=m.data||[];app.abilities=a.data||[];app.stats=s.data||[];app.competitors=c.data||[];app.logs=l.data||[];app.audits=u.data||[];app.archivedCount=h.count||0;app.previewGuildId=guildId}
function tasks(includeInactive=false){return app.tasks.filter(t=>includeInactive||t.active).map(t=>({id:Number(t.id),name:t.name,points:t.base_points,disabled:!t.active,sourceSeq:t.source_seq,rowVersion:t.row_version,updatedAt:t.updated_at}))}
function currentGuild(){if(!app.guild||!app.round)return null;const sm=new Map(app.stats.map(x=>[x.member_id,x])),am=new Map();for(const x of app.abilities){if(!am.has(x.member_id))am.set(x.member_id,[]);am.get(x.member_id).push(Number(x.task_id))}const r=app.round;return{id:app.guild.id,code:app.guild.code,name:app.guild.name,enabled:app.guild.enabled,stageNames:Array.isArray(app.guild.stage_names)?app.guild.stage_names:DEFAULT_STAGE_NAMES,updatedAt:app.guild.updated_at,rowVersion:app.guild.row_version,members:app.members.map(m=>{const s=sm.get(m.id)||{};return{id:m.id,name:m.name,note:m.note||'',active:m.active,rowVersion:m.row_version,abilitiesVersion:m.abilities_version||1,abilitiesUpdatedAt:m.abilities_updated_at,abilities:am.get(m.id)||[],currentPoints:s.current_points||0,freeUsed:s.free_used||0,paidUsed:s.paid_used||0,goal:s.target_points??r.personal_target,status:s.status||'可接任务',statVersion:s.row_version||1,updatedAt:m.updated_at}}),logs:app.logs.map(x=>({id:x.id,memberId:x.member_id,taskId:Number(x.task_id),taskName:x.task_name_snapshot,points:x.award_points,basePoints:x.base_points,doubled:x.doubled,attemptType:x.attempt_type,countsForGuild:x.counts_for_guild,time:x.created_at,operator:x.operator_name,reversedAt:x.reversed_at,reversedBy:x.reversed_by})),auditLogs:app.audits.map(x=>({id:x.id,action:x.action,detail:x.detail,operator:x.operator_name,time:x.created_at})),roundArchives:Array(app.archivedCount).fill(0),competition:{id:r.id,rowVersion:r.row_version,season:r.season_no,round:r.round_no,currentStage:r.current_stage,targetStage:r.target_stage,goalMode:r.goal_mode,customGoalScore:r.custom_goal_score,safetyMargin:r.safety_margin,avgBase:Number(r.estimated_avg_base),doubleRate:Number(r.estimated_double_rate),freeLimit:r.free_limit,paidLimit:r.paid_limit,personalTarget:r.personal_target,taskCap:r.guild_task_cap,guildTasksCompleted:r.guild_tasks_completed,competitors:app.competitors.map(x=>({id:x.id,name:x.name,score:x.score,arrival:x.arrival_order,isSelf:x.is_self,rowVersion:x.row_version}))}}}
function taskById(id){return tasks(true).find(t=>String(t.id)===String(id))}
function memberById(id){return currentGuild()?.members.find(m=>m.id===id)}
function maxTaskAward(){return Math.max(...tasks().map(t=>t.points*2),0)}
function memberProgress(m){const c=currentGuild().competition,target=Number(m.goal??c.personalTarget),used=m.freeUsed+m.paidUsed,total=c.freeLimit+c.paidLimit,rem=Math.max(0,total-used),need=Math.max(0,target-m.currentPoints),maxAward=maxTaskAward(),maxFinal=m.currentPoints+rem*maxAward,requiredAvg=rem?need/rem:(need?Infinity:0);let level='good',text='目标可达';if(need<=0){level='good';text='已达目标'}else if(maxFinal<target){level='bad';text='理论上已无法达成'}else if(requiredAvg>=maxAward-1){level='bad';text='极限冲刺'}else if(requiredAvg>=54){level='high';text='高分任务优先'}else if(requiredAvg>=44){level='lav';text='需要留意'}return{target,used,total,rem,need,maxFinal,requiredAvg,level,text,current:m.currentPoints}}
function competitionCalc(){const g=currentGuild(),c=g.competition,rows=[...c.competitors].sort((a,b)=>b.score-a.score||a.arrival-b.arrival),self=c.competitors.find(x=>x.isSelf),rank=rows.findIndex(x=>x.id===self.id)+1,first=rows[0],fourth=rows[3],next=rows[Math.min(rows.length-1,rank)],promoteGap=first.id===self.id?0:Math.max(0,first.score-self.score+(first.arrival<self.arrival?1:0)),avoidGap=rank<5?0:Math.max(0,fourth.score-self.score+(fourth.arrival<self.arrival?1:0)),steadyGap=next&&next.id!==self.id?Math.max(0,next.score+c.safetyMargin-self.score):0;let targetGap=promoteGap,targetLabel='冲第一还差';if(c.goalMode==='avoid'){targetGap=avoidGap;targetLabel='保级还差'}if(c.goalMode==='steady'){targetGap=steadyGap;targetLabel='安全领先还差'}if(c.goalMode==='custom'){targetGap=Math.max(0,c.customGoalScore-self.score);targetLabel='自定义目标还差'}if(c.goalMode==='save'){targetGap=0;targetLabel='节省钻石模式'}const active=g.members.filter(m=>m.active),totalRem=active.reduce((n,m)=>n+memberProgress(m).rem,0),capRem=Math.max(0,c.taskCap-c.guildTasksCompleted),effectiveRem=Math.min(totalRem,capRem),avgAward=c.avgBase*(1+c.doubleRate/100),scenarios=[.7,.85,1].map(rate=>({add:Math.floor(effectiveRem*avgAward*rate),final:self.score+Math.floor(effectiveRem*avgAward*rate)})),chances=5-c.round,maxStage=Math.min(8,c.currentStage+chances),needPromotions=Math.max(0,c.targetStage-c.currentStage);return{rows,self,rank,promoteGap,avoidGap,steadyGap,targetGap,targetLabel,totalRem,capRem,effectiveRem,scenarios,chances,maxStage,needPromotions}}
function goalModeLabel(v){return({promote:'全力升段',avoid:'避免第五',steady:'稳住名次',save:'节省钻石',custom:'自定义目标'})[v]||v}

function renderAdmin(){document.getElementById('root').innerHTML=`<div class="admin-shell"><div class="admin-head"><div><span class="pill lav">仅小妙可见</span><h1 style="margin-top:9px">小妙管理端</h1><p class="muted">公会授权和公共任务库均已连接 Supabase。</p></div><div class="row"><span class="cloud-badge"><i class="cloud-dot"></i>云端已连接</span><button class="btn btn-ghost" onclick="logout()">退出管理</button></div></div><div class="admin-tabs"><button class="btn btn-ghost ${adminTab==='guilds'?'active':''}" onclick="adminTab='guilds';renderAdmin()">公会授权</button><button class="btn btn-ghost ${adminTab==='tasks'?'active':''}" onclick="adminTab='tasks';renderAdmin()">任务库维护</button></div><div id="adminContent"></div>${footerHtml()}</div>`;adminTab==='tasks'?renderAdminTasks():renderAdminGuilds()}
function renderAdminGuilds(){document.getElementById('adminContent').innerHTML=`<section class="card paper" style="padding:21px;margin-bottom:18px"><div class="section-title"><div><h2>绑定授权公会</h2><p>为了不把最高权限密钥放进网页，公会登录账号仍由你在 Supabase 后台手动创建，网页只负责绑定公会码。</p></div><button class="btn btn-soft" onclick="showCreateGuildGuide()">查看创建步骤</button></div><div class="grid grid-3"><div><label class="label">已创建的登录邮箱</label><input id="newGuildEmail" class="input" type="email" placeholder="例如 XZWY2026@guild.invalid"></div><div><label class="label">公会名称</label><input id="newGuildName" class="input" placeholder="例如：夏之未央"></div><div><label class="label">公会码</label><input id="newGuildCode" class="input" placeholder="例如：XZWY2026"></div></div><button class="btn btn-primary" style="margin-top:15px" onclick="bindGuildAccount()">绑定公会账号</button></section><div class="section-title"><div><h2>已授权公会</h2><p>共 ${app.adminGuilds.length} 个。停用后，原公会码将无法登录。</p></div></div>${app.adminGuilds.length?app.adminGuilds.map(g=>`<div class="guild-admin-item card"><div><strong>${esc(g.name)}</strong><div style="margin-top:8px"><span class="pill blue">${esc(g.code)}</span> <span class="pill ${g.enabled?'good':'bad'}">${g.enabled?'正常使用':'已暂停'}</span> <span class="small muted">创建于 ${fmtTime(g.created_at)}</span></div></div><div class="guild-admin-actions"><button class="btn btn-sm btn-soft" onclick="adminPreviewGuild('${g.id}')">进入查看</button><button class="btn btn-sm btn-ghost" onclick="showResetPasswordGuide('${esc(g.code)}')">重置密码说明</button><button class="btn btn-sm ${g.enabled?'btn-danger':'btn-success'}" onclick="toggleGuild('${g.id}',${!g.enabled})">${g.enabled?'暂停':'恢复'}</button></div></div>`).join(''):`<div class="empty">还没有绑定公会。</div>`}`}
function showCreateGuildGuide(){openModal(`<div class="modal-head"><div><h3>创建一个新公会账号</h3><p class="muted">只需做一次，密码由你发给对方。</p></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="admin-guide"><div>打开 Supabase → Authentication → Users。</div><div>点击 Add user → Create new user。</div><div>邮箱可写成“公会码@guild.invalid”，例如 XZWY2026@guild.invalid。</div><div>设置公会访问密码，并开启 Auto Confirm User。</div><div>回到这里填写同一个邮箱、公会名称和公会码，点击“绑定公会账号”。</div></div>`)}
function showResetPasswordGuide(code){openModal(`<div class="modal-head"><div><h3>重置 ${esc(code)} 的密码</h3></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="admin-guide"><div>打开 Supabase → Authentication → Users。</div><div>找到该公会对应的隐藏邮箱。</div><div>点击用户行，选择修改密码或发送密码恢复。</div><div>保存后，把新密码单独发给公会管理者。</div></div>`)}
async function bindGuildAccount(){await withBusy(async()=>{const email=document.getElementById('newGuildEmail').value.trim(),name=document.getElementById('newGuildName').value.trim(),code=document.getElementById('newGuildCode').value.trim().toUpperCase();if(!email||!name||!code)return toast('请把邮箱、公会名称和公会码填写完整');try{const {error}=await db.rpc('admin_link_guild_account',{p_email:email,p_code:code,p_name:name});if(error)throw error;await loadAdminData();toast('公会已绑定');renderAdmin()}catch(e){showError(e,'绑定失败')}})}
async function toggleGuild(id,enabled){await withBusy(async()=>{try{const {error}=await db.rpc('admin_set_guild_enabled',{p_guild_id:id,p_enabled:enabled});if(error)throw error;await loadAdminData();toast(enabled?'公会已恢复':'公会已暂停');renderAdmin()}catch(e){showError(e)}})}
async function adminPreviewGuild(id){await withBusy(async()=>{try{await loadGuildData(id);activeTab='search';renderApp(true)}catch(e){showError(e,'载入公会失败');renderAdmin()}})}
async function exitAdminPreview(){await loadAdminData();app.guild=null;app.round=null;app.previewGuildId=null;renderAdmin()}
function renderAdminTasks(){document.getElementById('adminContent').innerHTML=`<section class="card paper" style="padding:21px;margin-bottom:18px"><div class="section-title"><div><h2>任务库版本</h2><p>新增、修改或停用任务后，建议同步更新版本号。</p></div></div><div class="grid grid-3"><div><label class="label">版本号</label><input id="taskVersion" class="input" value="${esc(app.taskLibrary.version)}"></div><div><label class="label">最后更新时间</label><div class="input" style="background:#fbf5f0">${fmtTime(app.taskLibrary.updatedAt)}</div></div><div style="display:flex;align-items:flex-end"><button class="btn btn-primary" style="width:100%" onclick="saveTaskVersion()">保存版本</button></div></div></section><section class="card" style="padding:21px;margin-bottom:18px"><div class="section-title"><div><h2>新增任务</h2><p>新增后会进入所有授权公会的任务清单。</p></div></div><div class="grid grid-3"><input id="customTaskName" class="input" placeholder="任务名称"><input id="customTaskPoints" class="input" type="number" min="1" max="99" placeholder="基础积分"><button class="btn btn-soft" onclick="addCustomTask()">新增任务</button></div></section><section class="card" style="padding:21px"><div class="section-title"><div><h2>全部任务</h2><p>${tasks(true).length}项，可修改积分或停用。历史记录不会因停用而消失。</p></div></div><input id="adminTaskSearch" class="input" placeholder="搜索任务" oninput="renderAdminTaskRows(this.value)"><div id="adminTaskRows" class="table-wrap" style="max-height:610px;margin-top:12px"></div></section>`;renderAdminTaskRows('')}
function renderAdminTaskRows(q){const list=tasks(true).filter(t=>norm(t.name).includes(norm(q))).sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name,'zh-CN'));document.getElementById('adminTaskRows').innerHTML=`<table class="table"><thead><tr><th>任务名称</th><th>基础分</th><th>翻倍</th><th>状态</th><th>操作</th></tr></thead><tbody>${list.map(t=>`<tr><td>${esc(t.name)}</td><td><input type="number" min="1" max="99" value="${t.points}" onchange="adminSetTaskPoint(${t.id},this.value)"></td><td>${t.points*2}</td><td><span class="pill ${t.disabled?'bad':'good'}">${t.disabled?'已停用':'使用中'}</span></td><td><button class="btn btn-sm ${t.disabled?'btn-success':'btn-danger'}" onclick="adminToggleTask(${t.id},${t.disabled})">${t.disabled?'恢复':'停用'}</button></td></tr>`).join('')}</tbody></table>`}
async function saveTaskVersion(){const version=document.getElementById('taskVersion').value.trim();if(!version)return toast('请输入版本号');try{const now=new Date().toISOString(),{error}=await db.from('app_settings').update({value:{version,updated_at:now}}).eq('key','task_library');if(error)throw error;await loadTaskLibrary(true);toast('版本已保存');renderAdminTasks()}catch(e){showError(e)}}
async function addCustomTask(){const name=document.getElementById('customTaskName').value.trim(),points=Number(document.getElementById('customTaskPoints').value);if(!name||!points)return toast('请填写任务名称和积分');try{const {error}=await db.from('tasks').insert({name,base_points:points,sort_order:9999,active:true});if(error)throw error;await loadTaskLibrary(true);toast('任务已新增');renderAdminTasks()}catch(e){showError(e)}}
async function adminSetTaskPoint(id,value){const points=clamp(value,1,99);try{const {error}=await db.from('tasks').update({base_points:points}).eq('id',id);if(error)throw error;await loadTaskLibrary(true);toast('积分已更新');renderAdminTasks()}catch(e){showError(e)}}
async function adminToggleTask(id,restore){try{const {error}=await db.from('tasks').update({active:restore}).eq('id',id);if(error)throw error;await loadTaskLibrary(true);toast(restore?'任务已恢复':'任务已停用');renderAdminTasks()}catch(e){showError(e)}}

function renderApp(adminPreview=false){const g=currentGuild(),c=g.competition,titles=Object.fromEntries(NAVS);document.getElementById('root').innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="app-brand"><div class="app-brand-logo">竞</div><div><strong>竞标赛助手</strong><small>云端任务小手账</small></div></div><nav class="nav">${NAVS.map(([id,t])=>`<button class="${activeTab===id?'active':''}" onclick="setTab('${id}')">${t}</button>`).join('')}</nav><div class="side-bottom"><div class="guild-mini"><strong>${esc(g.name)}</strong><small>${esc(g.code)} · 操作者 ${esc(operatorName())}</small></div>${adminPreview?`<button class="btn btn-soft btn-sm" style="width:100%;margin-bottom:7px" onclick="exitAdminPreview()">返回小妙管理</button>`:''}<button class="btn btn-ghost btn-sm" style="width:100%" onclick="logout()">退出登录</button></div></aside><main class="main"><header class="topbar"><div><h1>${titles[activeTab]}</h1><span class="tiny muted">最后同步 ${fmtTime(g.updatedAt)}</span></div><div class="top-meta"><span class="cloud-badge"><i class="cloud-dot"></i>已同步</span><span class="pill blue hide-phone">第${c.season}赛季 · 第${c.round}轮</span><span class="pill high">${esc(g.stageNames[c.currentStage-1])}</span><button class="btn btn-sm btn-ghost" onclick="openOperatorModal()">${esc(operatorName())}</button></div></header><div id="page" class="content"></div>${footerHtml()}</main></div>`;renderPage()}
function setTab(id){activeTab=id;renderApp(app.role==='admin')}
function renderPage(){({search:renderSearchPage,members:renderMembersPage,record:renderRecordPage,personal:renderPersonalPage,guild:renderGuildPage,settings:renderSettingsPage}[activeTab])()}
function openOperatorModal(){openModal(`<div class="modal-head"><div><h3>本机操作者名称</h3><p class="muted">共用公会账号时，用于操作记录区分会长和副会长。</p></div><button class="modal-close" onclick="closeModal()">×</button></div><input id="operatorInput" class="input" value="${esc(operatorName())}" maxlength="30"><button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="saveOperator()">保存</button>`)}
function saveOperator(){const v=document.getElementById('operatorInput').value.trim()||'公会管理员';localStorage.setItem(OPERATOR_KEY,v);closeModal();renderApp(app.role==='admin')}

function renderSearchPage(){const g=currentGuild(),c=g.competition,activeMembers=g.members.filter(m=>m.active),capRemain=Math.max(0,c.taskCap-c.guildTasksCompleted);document.getElementById('page').innerHTML=`<div class="grid grid-4" style="margin-bottom:16px"><div class="card kpi"><span>有效成员</span><b>${activeMembers.length}</b></div><div class="card kpi"><span>可用任务</span><b>${tasks().length}</b></div><div class="card kpi"><span>本轮任务记录</span><b>${g.logs.filter(x=>!x.reversedAt).length}</b></div><div class="card kpi"><span>公会有效任务余量</span><b>${capRemain}</b></div></div><section class="search-hero card paper"><div class="section-title"><div><h2>今天刷到了什么任务？</h2><p>输入一个字也可以。试试“夏”“画境”，或成员名字的一部分。</p></div></div><div class="search-box"><span class="search-icon">⌕</span><input id="globalSearch" class="input" value="${esc(searchQuery)}" placeholder="搜索任务或成员" oninput="searchQuery=this.value;renderSearchResults()"></div><div id="searchResults" style="margin-top:14px"></div></section><div id="taskDecision" style="margin-top:16px"></div>`;renderSearchResults();renderTaskDecision()}
function renderSearchResults(){const box=document.getElementById('searchResults');if(!box)return;const q=norm(searchQuery);if(!q){box.innerHTML=`<div class="helper">搜索结果会同时显示任务和成员。点击任务查看推荐人，点击成员查看能力清单。</div>`;return}const ts=tasks().filter(t=>norm(t.name).includes(q)).slice(0,30),ms=currentGuild().members.filter(m=>m.active&&norm(m.name).includes(q)).slice(0,20);box.innerHTML=`${ts.length?`<h3>相关任务</h3><div class="result-list">${ts.map(t=>{const count=currentGuild().members.filter(m=>m.active&&m.abilities.includes(t.id)).length;return`<button class="result-item" style="width:100%;text-align:left" onclick="selectTask(${t.id})"><div class="result-main"><strong>${esc(t.name)}</strong><small>基础${t.points}分 · 翻倍${t.points*2}分</small></div><div class="result-side"><span class="pill ${t.points>=29?'high':'blue'}">${count}人能做</span><span>›</span></div></button>`}).join('')}</div>`:''}${ms.length?`<h3 style="margin-top:16px">相关成员</h3><div class="result-list">${ms.map(m=>`<button class="result-item" style="width:100%;text-align:left" onclick="openMember('${m.id}')"><div class="result-main"><strong>${esc(m.name)}</strong><small>可做${m.abilities.length}项 · ${esc(m.status)}</small></div><span>›</span></button>`).join('')}</div>`:''}${!ts.length&&!ms.length?`<div class="empty">没有找到匹配内容。</div>`:''}`}
function selectTask(id){selectedTaskId=Number(id);renderTaskDecision();document.getElementById('taskDecision')?.scrollIntoView({behavior:'smooth',block:'start'})}
function candidateInfo(task,m){const p=memberProgress(m),highCount=m.abilities.filter(id=>(taskById(id)?.points||0)>=28).length;let score=0;const reasons=[];if(m.status==='可接任务'){score+=45;reasons.push('当前可接')}else if(m.status==='任务进行中'){score+=5;reasons.push('正在做其他任务')}else if(m.status==='暂时不在线'){score-=15;reasons.push('暂时不在线')}else{score-=999;reasons.push('次数已用完')}if(task.points>=29&&p.need>0&&p.maxFinal>=p.target){score+=Math.min(55,p.requiredAvg);reasons.push(`冲刺目标，后续平均需${fmt(p.requiredAvg)}分`)}if(task.points<=24){score+=Math.max(0,24-highCount*3);if(p.need<=0){score+=15;reasons.push('个人目标已完成')}else reasons.push(`高分能力${highCount}项`)}if(taskStrategy==='personal'&&p.need>0)score+=25;if(taskStrategy==='guild'&&m.status==='可接任务')score+=25;if(deadlineHours<=1&&m.status==='可接任务')score+=35;return{m,p,score,reasons:reasons.join('；')}}
function renderTaskDecision(){const box=document.getElementById('taskDecision');if(!box)return;if(!selectedTaskId){box.innerHTML='';return}const task=taskById(selectedTaskId);if(!task){box.innerHTML='';return}const all=currentGuild().members.filter(m=>m.active&&m.abilities.includes(task.id)),ranked=all.map(m=>candidateInfo(task,m)).sort((a,b)=>b.score-a.score),available=ranked.filter(x=>x.m.status==='可接任务');let advice='';if(!all.length)advice=`<div class="advice bad"><b>建议删除</b><br>当前公会能力库中无人可以完成此任务。删除前仍请核对成员资料是否录完整。</div>`;else if(!available.length)advice=`<div class="advice warn"><b>建议等待或联系成员</b><br>有${all.length}人具备条件，但当前无人标记为可接。距离截止${deadlineHours}小时，结合实际在线情况决定是否删除。</div>`;else if(task.points<=24&&all.length>=8)advice=`<div class="advice good"><b>低分通用任务</b><br>建议优先交给高分任务覆盖较少、或不冲1400的成员，保护稀缺高分能力。</div>`;else advice=`<div class="advice lav"><b>分配建议</b><br>推荐顺序同时参考在线状态、个人目标、剩余次数和高分能力稀缺度，最终仍由公会管理者决定。</div>`;document.getElementById('taskDecision').innerHTML=`<section class="card" style="padding:21px"><div class="section-title"><div><span class="pill ${task.points>=29?'high':'blue'}">基础${task.points} · 翻倍${task.points*2}</span><h2 style="margin-top:9px">${esc(task.name)}</h2><p>共${all.length}名成员可以完成。</p></div><button class="btn btn-ghost" onclick="selectedTaskId=null;renderTaskDecision()">关闭</button></div><div class="grid grid-3"><div><label class="label">推荐侧重</label><select class="select" onchange="taskStrategy=this.value;renderTaskDecision()"><option value="balanced" ${taskStrategy==='balanced'?'selected':''}>个人与公会均衡</option><option value="personal" ${taskStrategy==='personal'?'selected':''}>个人1400优先</option><option value="guild" ${taskStrategy==='guild'?'selected':''}>公会即时积分优先</option></select></div><div><label class="label">距截止约几小时</label><input class="input" type="number" min="0" value="${deadlineHours}" onchange="deadlineHours=Number(this.value);renderTaskDecision()"></div><div><label class="label">删除冷却剩余分钟</label><input class="input" type="number" min="0" value="${deleteCooldown}" onchange="deleteCooldown=Number(this.value);renderTaskDecision()"></div></div>${advice}<div class="candidate-list">${ranked.length?ranked.map((x,i)=>`<div class="candidate"><div class="candidate-rank">${i+1}</div><div><strong>${esc(x.m.name)}</strong><div class="candidate-reason">${esc(x.reasons)}；当前${x.p.current}分，剩余${x.p.rem}次</div></div><div><span class="pill ${x.m.status==='可接任务'?'good':'bad'}">${esc(x.m.status)}</span></div></div>`).join(''):`<div class="empty">无人具备该任务条件。</div>`}</div></section>`}
function openMember(id){selectedMemberId=id;abilityDraft=null;activeTab='members';renderApp(app.role==='admin')}

function renderMembersPage(){const g=currentGuild(),active=g.members.filter(m=>m.active);if(!selectedMemberId&&active.length)selectedMemberId=active[0].id;const selected=memberById(selectedMemberId);document.getElementById('page').innerHTML=`<div class="section-title"><div><h2>成员能力库</h2><p>长期保存成员资料，完整清单点选为主，搜索只负责缩小范围。</p></div><button class="btn btn-primary" onclick="openImportMembersModal()">批量导入成员</button></div><div class="member-layout"><section class="card member-list"><input class="input" placeholder="搜索成员" oninput="renderMemberList(this.value)" style="margin-bottom:8px"><div id="memberList"></div></section><section id="memberDetail"></section></div>`;renderMemberList('');renderMemberDetail(selected)}
function renderMemberList(q){const box=document.getElementById('memberList');if(!box)return;const list=currentGuild().members.filter(m=>norm(m.name).includes(norm(q)));box.innerHTML=list.length?list.map(m=>`<button class="${m.id===selectedMemberId?'active':''}" onclick="selectMember('${m.id}')"><b>${esc(m.name)}</b><small>${m.active?'有效成员':'已停用'} · 可做${m.abilities.length}项 · ${esc(m.status)}</small></button>`).join(''):`<div class="empty" style="padding:18px">没有匹配成员。</div>`}
function selectMember(id){selectedMemberId=id;abilityDraft=null;renderMembersPage()}
function renderMemberDetail(m){const box=document.getElementById('memberDetail');if(!box)return;if(!m){box.innerHTML=`<div class="card empty">请先导入成员。</div>`;return}if(!abilityDraft)abilityDraft=new Set(m.abilities.map(Number));box.innerHTML=`<section class="card paper" style="padding:21px;margin-bottom:16px"><div class="section-title"><div><h2>${esc(m.name)}</h2><p>修改基础资料、本轮积分和状态。</p></div><span class="pill ${m.active?'good':'bad'}">${m.active?'在会':'已停用'}</span></div><div class="grid grid-3"><div><label class="label">成员名字</label><input id="memberName" class="input" value="${esc(m.name)}"></div><div><label class="label">成员状态</label><select id="memberStatus" class="select">${STATUS_OPTIONS.map(s=>`<option ${s===m.status?'selected':''}>${s}</option>`).join('')}</select></div><div><label class="label">个人目标</label><input id="memberGoal" class="input" type="number" min="0" value="${m.goal}"></div></div><div class="grid grid-4" style="margin-top:12px"><div><label class="label">当前积分</label><input id="memberPoints" class="input" type="number" min="0" value="${m.currentPoints}"></div><div><label class="label">免费已用</label><input id="memberFree" class="input" type="number" min="0" value="${m.freeUsed}"></div><div><label class="label">购买已用</label><input id="memberPaid" class="input" type="number" min="0" value="${m.paidUsed}"></div><div><label class="label">成员状态</label><select id="memberActive" class="select"><option value="true" ${m.active?'selected':''}>在会</option><option value="false" ${!m.active?'selected':''}>停用</option></select></div></div><div style="margin-top:12px"><label class="label">备注</label><input id="memberNote" class="input" value="${esc(m.note)}" placeholder="例如：原名、资源情况或联络备注"></div><button class="btn btn-primary" style="margin-top:14px" onclick="saveMemberProfile('${m.id}')">保存成员资料</button></section><section class="card" style="padding:21px"><div class="section-title"><div><h2>TA 能接这些任务 ✦</h2><p>当前已选${abilityDraft.size}项。清空搜索后仍会保留刚才勾选的内容。</p></div></div><div class="task-toolbar"><input id="abilitySearch" class="input wide" value="${esc(abilityQuery)}" placeholder="搜索任务，例如：夏、守护神、画境" oninput="abilityQuery=this.value;renderAbilityList('${m.id}')"><button class="btn btn-sm ${abilityFilter==='all'?'btn-soft':'btn-ghost'}" onclick="abilityFilter='all';renderAbilityList('${m.id}')">全部</button><button class="btn btn-sm ${abilityFilter==='selected'?'btn-soft':'btn-ghost'}" onclick="abilityFilter='selected';renderAbilityList('${m.id}')">已选</button><button class="btn btn-sm ${abilityFilter==='high'?'btn-soft':'btn-ghost'}" onclick="abilityFilter='high';renderAbilityList('${m.id}')">28分以上</button></div><div id="abilityList"></div><div class="task-save-bar"><div><b>已选择 ${abilityDraft.size} 项</b><div class="small muted">能力资料长期保存，新一轮不会清空。</div></div><button class="btn btn-primary" onclick="saveAbilities('${m.id}')">保存能力清单</button></div></section>`;renderAbilityList(m.id)}
function renderAbilityList(memberId){const box=document.getElementById('abilityList');if(!box)return;let list=tasks().filter(t=>!abilityQuery||norm(t.name).includes(norm(abilityQuery)));if(abilityFilter==='selected')list=list.filter(t=>abilityDraft.has(t.id));if(abilityFilter==='high')list=list.filter(t=>t.points>=28);const groups=new Map();for(const t of list.sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name,'zh-CN'))){if(!groups.has(t.points))groups.set(t.points,[]);groups.get(t.points).push(t)}box.innerHTML=list.length?`<div class="task-groups">${[...groups.entries()].map(([pts,arr])=>`<div class="task-group"><h4>${pts}分任务 · 翻倍${pts*2}分</h4><div class="task-card-grid">${arr.map(t=>`<label class="task-check ${abilityDraft.has(t.id)?'checked':''}"><input type="checkbox" ${abilityDraft.has(t.id)?'checked':''} onchange="toggleAbility(${t.id},this.checked,'${memberId}')"><span><strong>${esc(t.name)}</strong><small>基础${t.points} · 翻倍${t.points*2}</small></span></label>`).join('')}</div></div>`).join('')}</div>`:`<div class="empty" style="margin-top:14px">没有匹配任务。</div>`}
function toggleAbility(id,checked,memberId){checked?abilityDraft.add(Number(id)):abilityDraft.delete(Number(id));renderMemberDetail(memberById(memberId))}
function openImportMembersModal(){openModal(`<div class="modal-head"><div><h3>批量导入成员</h3><p class="muted">一行一个名字，也支持逗号分隔。已存在的同名有效成员会自动跳过。</p></div><button class="modal-close" onclick="closeModal()">×</button></div><textarea id="importNames" class="textarea" placeholder="王晓明&#10;小紫&#10;小林"></textarea><button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="importMembers()">开始导入</button>`)}
async function importMembers(){await withBusy(async()=>{const raw=document.getElementById('importNames').value,names=raw.split(/[\n,，]/).map(x=>x.trim()).filter(Boolean);if(!names.length)return toast('请先填写成员名字');try{const {data,error}=await db.rpc('add_guild_members',{p_names:names,p_operator_name:operatorName()});if(error)throw error;closeModal();await loadGuildData(app.guild.id);selectedMemberId=data.inserted?.[0]?.id||selectedMemberId;toast(`新增${data.inserted_count}人，跳过${data.skipped_count}人`);renderApp(app.role==='admin')}catch(e){showError(e,'导入失败')}})}
async function saveMemberProfile(id){await withBusy(async()=>{const m=memberById(id);try{const name=document.getElementById('memberName').value.trim(),note=document.getElementById('memberNote').value,active=document.getElementById('memberActive').value==='true';const {error:e1}=await db.rpc('update_guild_member',{p_member_id:id,p_name:name,p_note:note,p_active:active,p_expected_version:m.rowVersion,p_operator_name:operatorName()});if(e1)throw e1;const patch={current_points:Number(document.getElementById('memberPoints').value)||0,free_used:Number(document.getElementById('memberFree').value)||0,paid_used:Number(document.getElementById('memberPaid').value)||0,target_points:Number(document.getElementById('memberGoal').value)||0,status:document.getElementById('memberStatus').value};const {data,error:e2}=await db.from('member_round_stats').update(patch).eq('round_id',app.round.id).eq('member_id',id).eq('row_version',m.statVersion).select().maybeSingle();if(e2)throw e2;if(!data)throw new Error('成员本轮数据已被其他人修改，请刷新后重试');await loadGuildData(app.guild.id);toast('成员资料已保存');renderApp(app.role==='admin')}catch(e){showError(e,'保存失败')}})}
async function saveAbilities(id){await withBusy(async()=>{const m=memberById(id);try{const {error}=await db.rpc('save_member_abilities',{p_member_id:id,p_task_ids:[...abilityDraft],p_expected_version:m.abilitiesVersion,p_operator_name:operatorName()});if(error)throw error;await loadGuildData(app.guild.id);abilityDraft=null;toast('能力清单已保存');renderApp(app.role==='admin')}catch(e){showError(e,'保存失败')}})}

function renderRecordPage(){const g=currentGuild(),members=g.members.filter(m=>m.active);if(!recordMemberId&&members.length)recordMemberId=members[0].id;const m=memberById(recordMemberId),allowed=m?tasks().filter(t=>!recordOnlyAbilities||m.abilities.includes(t.id)):[];if(recordTaskId&&!allowed.some(t=>t.id===recordTaskId))recordTaskId=null;document.getElementById('page').innerHTML=`<section class="card paper" style="padding:21px;margin-bottom:16px"><div class="section-title"><div><h2>一键登记任务完成</h2><p>只需选择成员、任务、是否翻倍和次数类型，积分与次数会同步更新。</p></div></div><div class="grid grid-3"><div><label class="label">完成成员</label><select id="recordMember" class="select" onchange="recordMemberId=this.value;recordTaskId=null;renderRecordPage()">${members.map(x=>`<option value="${x.id}" ${x.id===recordMemberId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label class="label">次数类型</label><select id="recordAttempt" class="select"><option value="free">免费次数</option><option value="paid">购买次数</option></select></div><div><label class="label">积分翻倍</label><label class="input" style="display:flex;gap:10px;align-items:center"><input id="recordDoubled" type="checkbox" checked> 本次任务已翻倍</label></div></div><div style="margin-top:14px"><label class="label">任务</label><div class="row" style="margin-bottom:9px"><button class="btn btn-sm ${recordOnlyAbilities?'btn-soft':'btn-ghost'}" onclick="recordOnlyAbilities=true;recordTaskId=null;renderRecordPage()">只看已登记能力</button><button class="btn btn-sm ${!recordOnlyAbilities?'btn-soft':'btn-ghost'}" onclick="recordOnlyAbilities=false;renderRecordPage()">查看全部任务</button></div><input class="input" placeholder="输入一个字筛选任务" oninput="renderRecordTaskChoices(this.value)"><div id="recordTaskChoices" class="result-list" style="margin-top:10px;max-height:330px;overflow:auto"></div></div>${recordTaskId?(()=>{const t=taskById(recordTaskId);return`<div class="advice good"><b>已选择：${esc(t.name)}</b><br>基础${t.points}分，翻倍后${t.points*2}分。</div>`})():''}<button class="btn btn-primary" style="width:100%" onclick="submitTaskCompletion()" ${!recordTaskId?'disabled':''}>确认完成并同步云端</button></section><section class="card" style="padding:21px"><div class="section-title"><div><h2>最近任务记录</h2><p>误操作可以撤销，系统会同时退回积分和次数。</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>成员</th><th>任务</th><th>积分</th><th>次数</th><th>状态</th><th>操作</th></tr></thead><tbody>${g.logs.slice(0,100).map(l=>{const mm=memberById(l.memberId);return`<tr><td>${fmtTime(l.time)}</td><td>${esc(mm?.name||'未知')}</td><td>${esc(l.taskName)}</td><td>${l.points}</td><td>${l.attemptType==='paid'?'购买':'免费'}</td><td><span class="pill ${l.reversedAt?'bad':'good'}">${l.reversedAt?'已撤销':l.countsForGuild?'计入公会':'仅个人'}</span></td><td>${l.reversedAt?'—':`<button class="btn btn-sm btn-danger" onclick="confirmReverse('${l.id}')">撤销</button>`}</td></tr>`}).join('')||`<tr><td colspan="7"><div class="empty">还没有任务记录。</div></td></tr>`}</tbody></table></div></section>`;renderRecordTaskChoices('')}
function renderRecordTaskChoices(q){const box=document.getElementById('recordTaskChoices');if(!box)return;const m=memberById(recordMemberId);let list=tasks().filter(t=>(!q||norm(t.name).includes(norm(q)))&&(!recordOnlyAbilities||m?.abilities.includes(t.id))).sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name,'zh-CN')).slice(0,80);box.innerHTML=list.map(t=>`<button class="result-item" style="width:100%;text-align:left;${recordTaskId===t.id?'border-color:#d5b878;background:var(--butter-soft)':''}" onclick="recordTaskId=${t.id};renderRecordPage()"><div class="result-main"><strong>${esc(t.name)}</strong><small>${t.points}分 · 翻倍${t.points*2}</small></div><span>›</span></button>`).join('')||`<div class="empty" style="padding:18px">没有匹配任务。</div>`}
async function submitTaskCompletion(){if(submitLocked||!recordTaskId||!recordMemberId)return;submitLocked=true;try{const {data,error}=await db.rpc('record_task_completion',{p_member_id:recordMemberId,p_task_id:recordTaskId,p_doubled:document.getElementById('recordDoubled').checked,p_attempt_type:document.getElementById('recordAttempt').value,p_operator_name:operatorName(),p_idempotency_key:uuid()});if(error)throw error;await loadGuildData(app.guild.id);toast(data.duplicate?'该操作已登记过':'任务已登记并同步');renderApp(app.role==='admin')}catch(e){showError(e,'登记失败')}finally{submitLocked=false}}
function confirmReverse(id){openModal(`<div class="modal-head"><div><h3>撤销这条任务记录？</h3><p class="muted">个人积分、次数和公会积分会一起退回。</p></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="advice bad">撤销操作会保留在审计记录中。</div><button class="btn btn-danger" style="width:100%" onclick="reverseTask('${id}')">确认撤销</button>`)}
async function reverseTask(id){await withBusy(async()=>{try{const {error}=await db.rpc('reverse_task_completion',{p_log_id:id,p_operator_name:operatorName()});if(error)throw error;closeModal();await loadGuildData(app.guild.id);toast('任务记录已撤销');renderApp(app.role==='admin')}catch(e){showError(e,'撤销失败')}})}

function renderPersonalPage(){const g=currentGuild();document.getElementById('page').innerHTML=`<section class="card paper" style="padding:21px;margin-bottom:16px"><div class="section-title"><div><h2>个人目标总览</h2><p>默认目标 ${g.competition.personalTarget} 分，可在成员资料中单独调整。</p></div><input class="input" style="max-width:300px" placeholder="搜索成员" oninput="renderPersonalCards(this.value)"></div></section><div id="personalCards" class="grid grid-2"></div>`;renderPersonalCards('')}
function renderPersonalCards(q){const list=currentGuild().members.filter(m=>m.active&&norm(m.name).includes(norm(q))).sort((a,b)=>memberProgress(b).requiredAvg-memberProgress(a).requiredAvg);document.getElementById('personalCards').innerHTML=list.length?list.map(m=>{const p=memberProgress(m),pct=Math.min(100,p.target?100*p.current/p.target:100);return`<section class="card person-card"><div class="person-head"><div><h3>${esc(m.name)}</h3><span class="small muted">${esc(m.status)} · 可做${m.abilities.length}项</span></div><span class="pill ${p.level}">${p.text}</span></div><div class="person-stats"><div class="person-stat"><b>${fmt(p.current)}</b><span>当前积分</span></div><div class="person-stat"><b>${p.rem}</b><span>剩余次数</span></div><div class="person-stat"><b>${fmt(p.need)}</b><span>距离目标</span></div><div class="person-stat"><b>${isFinite(p.requiredAvg)?fmt(p.requiredAvg):'—'}</b><span>后续平均</span></div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="helper" style="margin-top:9px">理论最高可达 ${fmt(p.maxFinal)} 分。</div><button class="btn btn-sm btn-soft" style="margin-top:12px" onclick="openMember('${m.id}')">调整数据</button></section>`}).join(''):`<div class="empty">没有匹配成员。</div>`}

function renderGuildPage(){const g=currentGuild(),c=g.competition,x=competitionCalc();document.getElementById('page').innerHTML=`<div class="grid grid-4" style="margin-bottom:16px"><div class="card kpi"><span>当前排名</span><b>第${x.rank}名</b></div><div class="card kpi"><span>${x.targetLabel}</span><b>${fmt(x.targetGap)}</b></div><div class="card kpi"><span>公会有效任务余量</span><b>${x.capRem}</b></div><div class="card kpi"><span>成员剩余总次数</span><b>${x.totalRem}</b></div></div><section class="card paper" style="padding:21px;margin-bottom:16px"><div class="section-title"><div><h2>本轮公会策略</h2><p>不同目标会影响任务推荐。</p></div></div><div class="grid grid-3"><div><label class="label">本轮目标</label><select class="select" onchange="updateRoundField('goal_mode',this.value)">${['promote','avoid','steady','save','custom'].map(v=>`<option value="${v}" ${c.goalMode===v?'selected':''}>${goalModeLabel(v)}</option>`).join('')}</select></div><div><label class="label">安全领先值</label><input class="input" type="number" min="0" value="${c.safetyMargin}" onchange="updateRoundField('safety_margin',this.value)"></div><div><label class="label">自定义目标积分</label><input class="input" type="number" min="0" value="${c.customGoalScore}" onchange="updateRoundField('custom_goal_score',this.value)"></div></div><div class="advice ${c.goalMode==='save'?'warn':'good'}"><b>${goalModeLabel(c.goalMode)}</b><br>${c.goalMode==='save'?'系统会优先使用免费次数和普通任务，不主动鼓励购买次数。':`${x.targetLabel} ${fmt(x.targetGap)} 分。对手积分仍会变化，此结果只反映当前时点。`}</div></section><section class="card" style="padding:21px;margin-bottom:16px"><div class="section-title"><div><h2>赛季与赛段</h2><p>每赛季4轮，每轮第1名升段，第5名降段。</p></div></div><div class="grid grid-3"><div><label class="label">当前赛段</label><select class="select" onchange="updateRoundField('current_stage',this.value)">${g.stageNames.map((s,i)=>`<option value="${i+1}" ${c.currentStage===i+1?'selected':''}>${i+1}. ${esc(s)}</option>`).join('')}</select></div><div><label class="label">目标赛段</label><select class="select" onchange="updateRoundField('target_stage',this.value)">${g.stageNames.map((s,i)=>`<option value="${i+1}" ${c.targetStage===i+1?'selected':''}>${i+1}. ${esc(s)}</option>`).join('')}</select></div><div><label class="label">当前轮次</label><div class="input" style="background:#fbf5f0">第${c.season}赛季 · 第${c.round}轮</div></div></div><div class="advice ${x.needPromotions<=x.chances?'good':'warn'}"><b>赛季路线</b><br>本赛季还剩${x.chances}次升段机会。连续拿第一时，理论最高可到第${x.maxStage}赛段。${x.needPromotions<=x.chances?'当前目标理论上仍可在本赛季达成。':`目标还需${x.needPromotions}次晋升，无法在本赛季内全部完成。`}</div></section><section class="card" style="padding:21px;margin-bottom:16px"><div class="section-title"><div><h2>本轮5个公会积分</h2><p>同分时，先到达序号越小，排名越靠前。</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>公会</th><th>当前积分</th><th>先到达序号</th><th>名次</th></tr></thead><tbody>${c.competitors.map(row=>{const r=x.rows.findIndex(z=>z.id===row.id)+1;return`<tr><td><input value="${esc(row.name)}" ${row.isSelf?'readonly':''} onchange="updateCompetitor('${row.id}','name',this.value)"></td><td><input type="number" min="0" value="${row.score}" onchange="updateCompetitor('${row.id}','score',this.value)"></td><td><input type="number" min="1" max="5" value="${row.arrival}" onchange="updateCompetitor('${row.id}','arrival',this.value)"></td><td><span class="pill ${row.isSelf?'high':'blue'}">第${r}名${row.isSelf?' · 我方':''}</span></td></tr>`}).join('')}</tbody></table></div></section><section class="card" style="padding:21px"><div class="section-title"><div><h2>公会剩余积分估算</h2><p>只把仍可计入公会积分的次数纳入估算。</p></div></div><div class="grid grid-3"><div><label class="label">预计平均基础分</label><input class="input" type="number" min="10" max="30" step="0.5" value="${c.avgBase}" onchange="updateRoundField('estimated_avg_base',this.value)"></div><div><label class="label">预计翻倍比例</label><input class="input" type="number" min="0" max="100" value="${c.doubleRate}" onchange="updateRoundField('estimated_double_rate',this.value)"></div><div><label class="label">可计公会积分次数</label><div class="input" style="background:#fbf5f0"><b>${x.effectiveRem}</b> 次</div></div></div><div class="grid grid-3" style="margin-top:16px">${x.scenarios.map((s,i)=>`<div class="card kpi"><span>${[70,85,100][i]}%完成情景</span><b>${fmt(s.final)}</b><span>预计新增 ${fmt(s.add)}</span></div>`).join('')}</div><div class="advice"><b>估算边界</b><br>对手会继续得分，任务也不一定按平均值刷出，因此这里只用于判断潜力。</div></section>`}
async function updateRoundField(column,value){const numeric=['current_stage','target_stage','safety_margin','custom_goal_score','estimated_avg_base','estimated_double_rate'].includes(column);const patch={[column]:numeric?Number(value):value};try{const {data,error}=await db.from('competition_rounds').update(patch).eq('id',app.round.id).eq('row_version',app.round.row_version).select().maybeSingle();if(error)throw error;if(!data)throw new Error('本轮设置已被其他人修改，请刷新后重试');app.round=data;toast('设置已同步');renderGuildPage()}catch(e){showError(e,'保存失败');await loadGuildData(app.guild.id);renderGuildPage()}}
async function updateCompetitor(id,key,value){const row=app.competitors.find(x=>x.id===id),map={name:'name',score:'score',arrival:'arrival_order'},val=['score','arrival'].includes(key)?Number(value):value;try{const {data,error}=await db.from('round_competitors').update({[map[key]]:val}).eq('id',id).eq('row_version',row.row_version).select().maybeSingle();if(error)throw error;if(!data)throw new Error('积分表已被其他人修改，请刷新后重试');Object.assign(row,data);renderGuildPage()}catch(e){showError(e,'保存失败');await loadGuildData(app.guild.id);renderGuildPage()}}

function renderSettingsPage(){const g=currentGuild(),c=g.competition;document.getElementById('page').innerHTML=`<section class="card paper" style="padding:21px;margin-bottom:16px"><div class="section-title"><div><h2>本轮规则参数</h2><p>不同赛段规则可能不同，因此18+6和1400都可以调整。</p></div></div><div class="grid grid-4"><div><label class="label">免费次数</label><input class="input" type="number" min="0" value="${c.freeLimit}" onchange="updateRule('free_limit',this.value)"></div><div><label class="label">购买次数</label><input class="input" type="number" min="0" value="${c.paidLimit}" onchange="updateRule('paid_limit',this.value)"></div><div><label class="label">默认个人目标</label><input class="input" type="number" min="0" value="${c.personalTarget}" onchange="updateRule('personal_target',this.value)"></div><div><label class="label">公会任务完成上限</label><input class="input" type="number" min="0" value="${c.taskCap}" onchange="updateRule('guild_task_cap',this.value)"></div></div><div class="grid grid-2" style="margin-top:12px"><div><label class="label">本轮公会已完成有效任务</label><input class="input" type="number" min="0" max="${c.taskCap}" value="${c.guildTasksCompleted}" onchange="updateRule('guild_tasks_completed',this.value)"></div><div><label class="label">任务库信息</label><div class="input" style="background:#fbf5f0">版本 ${esc(app.taskLibrary.version)} · 更新 ${fmtTime(app.taskLibrary.updatedAt)}</div></div></div></section><section class="card" style="padding:21px;margin-bottom:16px"><div class="section-title"><div><h2>赛段名称</h2><p>修改后一次性保存，避免多人同时编辑覆盖。</p></div><button class="btn btn-primary" onclick="saveStageNames()">保存8个名称</button></div><div class="grid grid-4">${g.stageNames.map((s,i)=>`<div><label class="label">第${i+1}赛段</label><input id="stageName${i}" class="input" value="${esc(s)}"></div>`).join('')}</div></section><section class="card" style="padding:21px;margin-bottom:16px"><div class="section-title"><div><h2>数据备份</h2><p>导出的是当前云端快照，可用于人工核查和恢复。</p></div></div><div class="row"><button class="btn btn-primary" onclick="exportGuildData()">导出JSON备份</button><span class="helper">为防止误覆盖，联网版暂不开放一键导入。需要恢复时由小妙管理员处理。</span></div></section><section class="card" style="padding:21px;margin-bottom:16px"><div class="section-title"><div><h2>开始新一轮</h2><p>旧轮次会归档，成员名单和能力清单永久保留。</p></div></div><button class="btn btn-soft" onclick="openResetRoundModal()">开始新一轮</button><div class="helper" style="margin-top:12px">云端已保存 ${app.archivedCount} 份历史轮次。</div></section><section class="card" style="padding:21px"><div class="section-title"><div><h2>最近操作记录</h2><p>记录操作者、修改时间和主要动作，方便排查误操作。</p></div></div><div class="audit-list">${g.auditLogs.length?g.auditLogs.map(a=>`<div class="audit-item"><b>${esc(a.action)} · ${esc(a.detail)}</b><small>${fmtTime(a.time)} · ${esc(a.operator)}</small></div>`).join(''):`<div class="empty">还没有操作记录。</div>`}</div></section>`}
async function updateRule(column,value){const patch={[column]:Number(value)};try{const {data,error}=await db.from('competition_rounds').update(patch).eq('id',app.round.id).eq('row_version',app.round.row_version).select().maybeSingle();if(error)throw error;if(!data)throw new Error('规则参数已被其他人修改，请刷新后重试');app.round=data;toast('规则已同步');renderSettingsPage()}catch(e){showError(e,'保存失败');await loadGuildData(app.guild.id);renderSettingsPage()}}
async function saveStageNames(){const names=DEFAULT_STAGE_NAMES.map((_,i)=>document.getElementById(`stageName${i}`).value.trim()||`第${i+1}赛段`);try{const {error}=await db.rpc('update_guild_stage_names',{p_stage_names:names,p_expected_version:app.guild.row_version,p_operator_name:operatorName()});if(error)throw error;await loadGuildData(app.guild.id);toast('赛段名称已保存');renderApp(app.role==='admin')}catch(e){showError(e,'保存失败')}}
function exportGuildData(){const data={type:'guildBidAssistantCloudBackup',version:3,exportedAt:new Date().toISOString(),guild:app.guild,round:app.round,members:app.members,abilities:app.abilities,stats:app.stats,competitors:app.competitors,logs:app.logs,audits:app.audits,taskLibrary:app.taskLibrary};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${app.guild.name}_竞标赛助手云端备份_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function openResetRoundModal(){const g=currentGuild();openModal(`<div class="modal-head"><div><h3>开始新一轮</h3><p class="muted">系统会把当前轮次归档，不会删除成员能力。</p></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="advice warn"><b>会重置</b><br>当前积分、已用次数、临时状态、五个公会积分和本轮任务完成数。</div><div class="advice good"><b>会保留</b><br>成员名单、可完成任务、备注、任务明细历史和操作记录。</div><label class="label">下一轮所在赛段</label><select id="nextStage" class="select">${g.stageNames.map((s,i)=>`<option value="${i+1}" ${g.competition.currentStage===i+1?'selected':''}>${i+1}. ${esc(s)}</option>`).join('')}</select><div style="height:12px"></div><label class="label">输入“开始新一轮”确认</label><input id="resetText" class="input" placeholder="开始新一轮"><button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="resetRound()">确认开始</button>`)}
async function resetRound(){if(document.getElementById('resetText').value.trim()!=='开始新一轮')return toast('请按提示输入确认文字');await withBusy(async()=>{try{const {error}=await db.rpc('start_new_round',{p_next_stage:Number(document.getElementById('nextStage').value),p_operator_name:operatorName(),p_guild_id:app.role==='admin'?app.guild.id:null});if(error)throw error;closeModal();await loadGuildData(app.guild.id);toast('新一轮已开始，旧数据已归档');renderApp(app.role==='admin')}catch(e){showError(e,'开始新一轮失败')}})}

boot();
</script>
</body>
</html>
